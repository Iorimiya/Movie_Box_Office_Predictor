url: https://www.ptt.cc/bbs/movie/M.1550773953.A.EE1.html
title: '[普雷] 密弒遊戲 - 親民版的奪魂鋸'
content: '大家好

  我是專看恐怖片的LittleDiDi

  我又來介紹恐怖片了

  不多說什麼就講個觀念

  看電影是主觀的



  Blog圖文版會更精采




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 密弒遊戲


  2.觀影時間 : 2019.2.16


  3.觀影地點 : 上海某影城


  4.觀影方式 : 自行購票



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可

  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  年份：2019


  國別：美國


  類型：驚悚、懸疑


  導演：Adam Robitel



  [劇情簡介]


  講述6名從不同意外中生還的陌生人，在努力回歸正常生活時，突然收到不明來歷的密室

  逃脫遊戲邀請。


  遊戲中總共有5大關卡：「毒火煉獄」、「冰天雪地」、「顛倒世界」、「毒氣密室」與

  「迷幻空間」，在不同闖關過程中，他們亦被迫面對自我最黑暗的過往瘡疤，他們也才意

  識到這不只是場遊戲，為求生存與贏取高達百萬美元的獎金，所有人不僅需互相幫助，還

  必須賭上性命互相傷害，因為最後只能有一位贏家倖存…


  (以上引用自開眼電影網)



  看這部電影的時候我人剛好在上海，台灣上映的日期相對其他國家晚了許多，既然如此就

  來寫寫想法給大家參考，只是說這是部即將上檔的電影，我說過擋人財路如殺人父母，所

  以我盡量別帶太多主觀意識，而是用介紹的方式來聊本片的特色，若各位對這部電影有興

  趣，不妨聽我說兩句，再決定要不要捧場消費。


  我簡單講結論，這部片就是親民版的《奪魂鋸》。


  還記得我在《奪魂鋸2》這篇影評裡提到過，我嚴重懷疑密室逃脫遊戲絕對是參考該片的

  概念而來，如果你看過《奪魂鋸》系列比較偏向於密室逃脫的部分，那這部片基本上走的

  就是那種模式，一群不認識的人因為某種緣故而聚集在一起，然後透過房間給出來的線索

  ，透過解開謎題通過一層層的關卡，只是比較帶點可怕的地方是，玩不好可是會要人命的

  。


  只能說這種模式太萬用也太好用，只要換一下謎題跟懲罰方式就是新東西，既然《奪魂鋸

  》都可以玩好幾次，沒道理別人就不能玩，在這部《密弒遊戲》則是聚集了六個互不相識

  的陌生人，他們各自收到親朋好友的邀請函，裡面提到只要參加一場競賽，勝利者就可以

  贏得一萬塊美金(這也太吝嗇了吧)。


  既然電影的開頭就開宗明義告訴觀眾這是一場鴻門宴，那我們也就不用太避諱講這些衰仔

  將會遇到怎麼樣的事情，首先他們在迷迷糊糊之間開啟了第一道關卡，由於裡頭有人是密

  室遊戲的玩家，講解與誇讚機關的華麗應該會引起密室遊戲愛好者的共鳴，然而也嗅到幾

  分危險與不對勁。


  不見棺材不掉淚，隨著關卡越來越致命，它們才驚覺這不只是一場遊戲。


  本片基本上節奏還算流暢，電影從鋪陳氣氛到闖關過程可以說沒有什麼冷場，每個關卡都

  有呈現出一定的謎題難度與險象環生的刺激感，其中又以「顛倒世界」算是達到一個極致

  ，既有解謎的樂趣與動作場面，六個角色之間的人物特性與刻劃也有所著墨，秉持了在這

  種生死存亡之際必有的人性衝突與拉扯背後的真相很黑暗的必然的，都請君入甕還不夠陰

  險嗎?


  各位可能覺得我吃錯藥還是在業配，是的，以上官方說詞純留給恐怖片初學者以及沒看過

  類似題材的朋友，因為同行的朋友有人也是說挺好看的，但在我看來根本呵呵，好吧，以

  下開始講本人真實的主觀感受，可能有點毒舌跟暴雷，不介意的就繼續給他看下去。




  ////////////////////////////////////我是雷線/////////////////////////////////
















  隔天我終於忍不住問那些說好看的同行哪裡好看，他們的說法是覺得題材蠻有新鮮感的，

  其他的就如我上述的解謎過程很有趣，也沒有什麼冷場，而且在那種情況下還會死人很驚

  悚，背後的陰謀也讓人不寒而慄.....等等等等，聽到這裡，好吧，我只好默默轉身在不

  為人知的角落翻白眼，鼻子摸摸暗自吞下這無奈。


  挖咧糙，這種密室逃脫的題材早說過在《奪魂鋸2》就開始演到最近的《奪魂鋸：遊戲重

  啟》，是都沒看過寫的文是不是，我猜大概是看到《奪魂鋸》三個字就嚇尿哪還敢看下去

  ，好吧，我是有點氣啦，浪費我TM的時間還要聽他們吹這部片好厲害，算了，裝睡的人叫

  不醒。


  就算說你不敢看《奪魂鋸》好了，這類的題材也早就玩爛了，隨便舉《要聽神明的話》、

  《血之期中考》也都是相似的題材。


  因此在我看來，本片的題材非但不新鮮，還非常地套路，完完全全地就是走《奪魂鋸》的

  模式，而且還是非常沒fu的模式，哪裡沒fu，直說這部片子完完全全沒有死人的畫面，不

  是沒有死人，各位懂我意思嗎?也就是因為這樣你看好像很刺激很驚險，我看是很冷場，

  因為你壓根就知道有人會死(每個關卡固定死一個，而且一定都會在最後一刻過關)，只是

  他不會死給你看。


  沒有死人畫面就已經把這樣題材的觀影興緻腰斬，再者，你說解謎很有趣，確實這部片子

  在開頭的前幾段還表現的煞有其事，就算我不打趣但對密室遊戲愛好者來說肯定會有所共

  鳴，然而越到後來就越打馬虎眼，謎底根本瞎猜，而且也搞扯到每個人不為人知的背景，

  但又不若《奪魂鋸》帶有循循善誘的背後意義，給出的解釋只是大魔王覺得這樣好玩，客

  戶覺得有趣，可以在瞎扯一點沒關係。


  更令人傻眼的結尾，遊戲大師居然就敢這樣跟勝利者單獨面對面，已經被陰過的人有豈會

  跟你講道理，偏偏我們這個勝利者就是好天真好善良，然後就被陰了。電影玩了幾次逆轉

  ，但是看過《奪魂鋸》的人肯定無感，拿來隨便跟評價最差的《奪魂鋸4》(個人認為最差

  )比也是懶叫比雞腿。


  說過，即使不新鮮起碼是萬用的題材，那為什麼還可以拍得如此無趣呢?百思不解的時候

  我就看一下是哪位天才導演，這......這不是導《陰兒房4》的那個普隆拱，看來我發現

  癥結點，好吧，早該注意到就不會跟團了，不如跟另外的去死去死團還比較有趣。


  話說回來，我們也不能都用自己的角度去看待別人，畢竟每個人對於恐怖驚悚的接受度都

  是很不一樣的，若用純看娛樂面的話，這部電影也並不是那麼糟，至少比起2017的那兩部

  同名電影是好多了，只是說對於已經看慣了恐怖片，沒來點葷的就食之無味的人來說，就

  會覺得相當冷場。


  即刻短評(滿分5)


  劇情：2       >>都算老掉牙的題材了吧，而且還很套路

  結局：2       >>無聊人士真的很多，找死跟找人去死的都一樣

  血腥：1.5     >>這種片不太見血看得真是欲振乏力

  氣氛：2.5     >>前面還有模有樣，後面荒腔走板

  推薦：2,5     >>是不差啦，只是讓我看得哈欠連連












  --

  沒有不推薦看喔

  只是就恐怖片迷而言太清淡

  當燒腦動作片還是有基本的娛樂性'
