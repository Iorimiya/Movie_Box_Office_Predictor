title: '[請益] 奪魂鋸 遊戲重啟的問題'
content: '有雷




















  剛看完奪魂鋸，真的是非常的爽快。

  雖然板上評價普普。

  但有被騙到，而且結尾超級大震撼。

  光這點就覺得很滿足。

  很期待續集。


  有個疑問：

  那個醫生在第一關遊戲的時候，為什麼只是被割到，約翰(拼圖殺人狂)就直接讓他離開遊

  戲了呢？


