title: '[討論] 重溫 奪魂鋸1 (Saw)的劇情疑點'
content: '防雷






















  亞當在裝手鋸的黑袋子中發現幾張不是他拍攝的照片，裡面有一張是 齊普(男看護)在醫

  生家中從窗簾往外看的照片，這張照片不是黑人警察拍攝的嗎？



  齊普綁架醫生家人的時候，從窗戶探頭被黑人警察拍到，這個時間點主角們應該正在闖關

  ，為什麼這張照片會出現在舊浴室裡，感覺時間軸好像對不上



  雖然知道這系列有個把戲是，導演給你看的畫面不一定是當下的時間軸，但怎麼想都覺得

  那張照片不應該出現在舊浴室，不知道大家怎麼想的呢？


