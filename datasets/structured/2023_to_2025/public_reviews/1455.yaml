  \n被Cecil猛開的門撞到肚子，流產(畫面倒敘式呈現)\n\nMatthews警探為阻止開門進來的人觸動機關，被Matthews警探開槍射傷\n\n\n\n\
  回娘家去了\n\n在死了四個人的房間納悶著，被Hoffman警官關在屋裡\n\n假扮受害者，說Game Over關門\n\n活在倒敘畫面中\n\n\n\n\n\n\
