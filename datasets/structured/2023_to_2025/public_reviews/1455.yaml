url: https://www.ptt.cc/bbs/movie/M.1696135723.A.7E3.html
title: '[超級好雷] 改善奪魂鋸缺點的集大成之作 奪魂鋸X'
content: '防雷







  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  奪魂鋸從第一集成為經典之後，續集被人詬病的地方不外乎是

  1.狗尾續貂

  2.胡亂殺戮

  3.遊戲沒有贏家

  等以上缺點


  但這集找回老頭回來演主角，把狗尾續貂的問題解決了

  粉絲都知道老頭就是為了治療癌症的因果才開啟了奪魂鋸

  這集讓觀眾跟著老頭抱著希望>被騙>絕望>給騙子們改過自新的機會



  與其像4.5.6.7.9那樣，找一堆跟老頭沒關的人玩遊戲

  老實說我看了也沒臨場感

  但這集我們有跟著老頭一起被騙的過程

  感受就完全不同


  另外遊戲也有贏家，這也是跟以前的續集大不相同

  當然這能用以前都是霍夫曼設計的來解釋

  這次老頭親自監製，確實是有贏法的


  對於贏家，老頭也秉持初心，替你治療、替你送醫院

  像當初治療高登醫生那樣



  劇中對老角色的刻畫很用心

  從老頭對癌症的執著，到亞曼達對同樣吸毒犯玩家的憐愛

  都讓這些老角色變得更圓滿


  有負雷文是說從後半段開始就完全看不懂，或是太攏長

  我倒是完全沒有這麼覺得

  如果你對奪魂鋸1~7集越熟，自然就看得越開心


  老頭親自下來玩遊戲也是一大創新

  雖然從第一集就會有"拼圖殺人狂人會在現場"的設定

  但這是他第一次自己玩

  跟小男孩之間互相拯救的戲碼，也不曾再奪魂鋸表現過

  相當精采


  最後再來個大團圓

  亞當、霍夫曼、老頭全員在浴室集合當片尾精彩片段

  我看得很滿意

  如果是奪魂鋸粉，你一定會愛上這集



  --'
