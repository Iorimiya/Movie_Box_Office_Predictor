url: https://www.ptt.cc/bbs/movie/M.1537627094.A.658.html
title: '[無雷] 補完奪魂鋸系列'
content: '最近補完《奪魂鋸》（Saw）系列全七集+《奪魂鋸：遊戲重啟》（Jigsaw）。除了第一集

  外，都是這個月補完。


  觀看的順序是：1→8(Jigsaw)→2→3→4→5→6→7


  喜愛的順序是：1>2>8>3>4=5=6>7


  整體來說，《奪魂鋸》的劇情都滿用心（十分重視故事與前面故事的銜接、各種遊戲設計

  與對「拼圖殺人魔」作案意圖的詮釋），血腥程度也有越來越高的趨勢。除了第七集莫名

  的血漿色調不一（pink色真的讓人很無法接受），其他的場景、化妝與遊戲設計都稱得上

  精彩好看。


  密集看完之後回想，覺得第一集是獨立看就很棒，第二集接著第一集演起來也不錯，但到

  第三集之後，故事似乎有意要變成一個可以一直發展現去的設計，接著一直演到七集，都

  是前面的角色、以不同的方式增減轉換地把故事演下去。雖然遊戲的梗還在，劇情也是很

  巧妙，但看的過程似乎少了點第一、二集那種懸疑緊張感，反而有點像是在看一個永遠不

  會「被結束」的故事（這不是「OO宇宙」的構想，反而更像是現在流行的影集，只是《奪

  魂鋸》為了讓每一集還是有其獨立性，有更多的提示和回憶...連續著看，總覺不是那麼

  能被說服）。


  去年上映的《奪魂鋸：遊戲重啟》，算是多年後試圖重啟之作。在電影裡也是過了許多年

  ，敍事上也作了變化，算是頗有別於3至7集的佳作。但以《奪魂鋸：遊戲重啟》的結局來

  看，下一集要能夠吸引人並不容易（如果繼續發展下去，可能需要更好的「點子」...，

  比如說每一集都有一個「門徒」上場表演，而不是延續前一集...之類的）。


  #終於補完全系列

  #豬頭超搶眼

  #豬頭才是主角吧


  ***


  這裡是我的樂園：






  FB:













  --'
