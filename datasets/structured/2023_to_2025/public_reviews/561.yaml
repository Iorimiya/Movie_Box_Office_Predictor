url: https://www.ptt.cc/bbs/movie/M.1740559555.A.E10.html
title: '[選片] 喵的奇幻漂流 粗獷派建築師 吸血鬼諾斯'
content: '這三部場次似乎剩不多 沒時間全看

  想要在電影院看氣氛效果最好的片

  其他等上串流


  喵的奇幻漂流預告鏡頭還不錯

  跟粗獷派建築師都是獎季片


