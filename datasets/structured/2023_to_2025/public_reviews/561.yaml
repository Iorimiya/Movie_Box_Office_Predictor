url: https://www.ptt.cc/bbs/movie/M.1740131816.A.E14.html
title: '[好雷] 【喵的奇幻漂流】必須細思極悲的過度思考'
content: '‧


  這篇文章在幾個月前就已經寫好，原以為只是一部平淡中含有末世論的動物歷險，但隨著

  光陰荏苒，手中敲打的字詞，不斷的被自我推翻；才發現這部動畫電影居然如此可怕，可

  怕到像似深沉內斂的慢速洪水，侵蝕打翻腦中的想法。


  在幾個月以前，我並不認為這是部能跟腦筋急轉彎2、荒野機器人抗衡的電影，但現在卻

  是能有非常大的機會扳倒兩位大哥；當然對於劇情的討論，更是讓許多國外觀眾紛紛唇槍

  舌戰，無論是戰爭難民論、人類地外移民概念、行星撞擊論、人變動物論、祭祀神學論，

  甚至連外星人論點，都討論的沸沸揚揚；但身為一名基層教育者，我更想利用情緒教育的

  觀點切入，來討論一場你我都應該知道的，用共存互助克服恐懼的成長之旅。



  ‧


  貓看著水中倒影，身處在這陌生環境，感覺有些恐懼，對著還未茁壯的心還有點疑惑，依

  賴的空房是牠的避風港，正如所有脫離母體的孩子們，對於家有極度的依賴性；而一場名

  為成長的洪水，迫使牠必須學習克服依賴及恐懼，水中的魚不斷往前流動，正如貓的貓生

  ，也須順水而生。


  水豚充滿了刻板的自滿不願面對現實的形象，話不多，看起來不是個很好溝通的人，對於

  所有事情都不甚上心。


  路上遇到的狐猴，可能是你人生中都會出現的討厭人，但也代表了物質主義，不斷得透過

  物質來獲取安全及虛榮感。


  而當貓掉進了洪水深淵的絕望中時，鯨魚則是帶著希望拯救了貓，牠是人生的困境中，為

  你伸出援手的人；隨後重逢的狗代表著善良的友誼。


  而溫柔叼魚給貓的鳥，牠有著高貴溫柔的氣息，充滿正義感不畏強權保護著貓，只是高傲

  的態度，讓牠無視於其他動物，但牠雪白的飛行翅膀是如此的自由，是貓的嚮往成為的目

  標。


  牠們乘上這艘船，帶著各自不同的情緒與作為，乘了一艘為了成長之旅所規劃的諾亞方舟

  。



  ‧


  貓克服了對水的恐懼，不斷捕魚給予同伴，正如同我們嬰孩時期第一次學會走路一樣，或

  是我們領到第一份薪水分享給家人那般，那樣的興奮快樂；但在一帆風順之時，總是會來

  場大浪。


  貓在風雨中請求鳥救助其他狗時，鳥不願意甚至拋棄了這艘船，當貓鳥在石柱上時，絢爛

  卻帶哀傷離別，代表放下了自傲與怨恨的情緒，才使得能進一步昇華，同樣的貓告別了鳥

  這樣如同母親的角色，鳥也放心了，貓沒有成為像鳥群一樣的動物。



  ‧


  放下了驕傲與怨恨後，得大水退去，在森林中的一群狐猴觀看鏡中自我，面對貓的求助，

  狐猴群如同是經歷了變故，而不願去在意他人的求助的自我保護行為；但所幸陪伴著貓經

  歷一切的狐猴，拋下了鏡子，幫助了貓，學會了互助的心。


  為了解救困在船上的狗群與動物們，水豚再也不冷眼旁觀，試著改變自己；所有的動物都

  改變了做為與情緒，似乎是一件好事，也許從此就要過著快樂的幸福森林生活。


  再一次的鹿奔，貓看到了曾經幫助他的鯨魚，因洪水退去而奄奄一息，這一刻讓動物們知

  道，凡事都有無可奈何的時候，我們能做的，也許只有在旁邊關心陪伴。


  鹿奔之後洪水是否再次來襲，我們無從得知，貓再一次看著水中倒影，水似乎又慢慢開始

  流動，只是這次牠有同伴們的陪伴，但少了船的牠們，似乎這一幕畫面飄起了死亡的氣息

  ，我很不願意如此這樣想，怕眼淚潸然流下，但無論結果如何，牠們學到了共存及互助的

  意義，只是最後倒影中的眼神，是如此的勇敢，但也有一絲絲的落寞，我很希望牠們沒事

  。



  ‧


  【喵的奇幻漂流】是一部如同片名一般，各種情緒有時如洪水、有時是涓涓細水，不斷變

  化形式衝擊觀眾的心，有太多的論點及想法，邀請觀眾一同來過度思考，我很期待各式各

  樣的心得評論，因為這部動畫就是如此有料、有東西，無論這隻黑貓有沒有辦法扳倒兩位

  大哥，他都會是我人生看過的動畫中，最令我深刻及哀傷，因那一面水中倒影，蘊藏了無

  數情緒的堆疊。



  ‧




  追蹤茶太郎IG





  --'
