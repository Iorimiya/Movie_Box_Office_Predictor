url: https://www.ptt.cc/bbs/movie/M.1740224214.A.41E.html
title: '20'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  今年的奧斯卡最佳動畫長片，不再讓皮克斯以《腦筋急轉彎2》專美於前，除了夢工廠推

  出的《荒野機器人》同樣呼聲高之外，代表拉脫維亞角逐最佳國際影片的黑馬《喵的奇幻

  漂流》也殺出重圍，成為支持者眾的入圍作品。



  當世界即將走向末日，卻充斥著人類存在的痕跡。



  雖說電影絲毫沒有說教，但從背景設定到整段故事進程，處處都是環境遭到破壞且人類涉

  入其中的痕跡。從喵的居住地明顯看得出大概是其主人過去的居所，到動物們搭著「諾亞

  方舟」四處漂流時所經過的雕像與建物，甚至是狐猴視若珍寶的玻璃瓶與手鏡，都絕對不

  是大自然的產物。《喵的奇幻漂流》從頭到尾都沒有說明這場洪水為何而來，動物行經之

  處又為何杳無人跡，但可能這就是末日將至的景致。人類率先滅亡，但留下懂得共存與互

  助的動物，繼續在這片大地譜寫自己的故事。



  《喵的奇幻漂流》的概念與整體故事架構，都讓人想到《少年Pi的奇幻漂流》，所以台灣

  片商也如此命名。就像《少年Pi的奇幻漂流》一般，面對一場劫難，素未謀面的動物們為

  了求生，只好共享一艘小船。牠們彼此不知道對方的習性，或膽怯，或害怕，從一開始的

  相敬如賓，到最後的同舟共濟。漂流的過程，也如《少年Pi》一樣曾經上岸遊玩，也不一

  定都獲得好的體驗，但行經的地點，絕對是喵本來窩在破窗的屋子裡時，永遠無法見識到

  的。喵也與Pi一樣，在這段漂流裡，遇見美麗的鯨魚。最後突然退去的洪水讓鯨魚擱淺，

  但鹿群奔跑的伏筆與最後水面上升起的尾鰭，除了暗示下一波的洪水再次到來，大概也預

  告著喵與動物朋友們也踏上下一段旅程。



  片中的動物皆非擬人化，牠們都非常「做自己」。喵就是一隻會吐毛球，喜歡追逐光影與

  會動物體的貓；拉不拉多是傻呼呼的可愛狗狗，總是為你好，但有時候會弄巧成拙；水豚

  想睡就倒頭呼呼大睡，默默關心著船上動物，但卻擺脫不了呆萌呆萌的個性；蛇鷲為了保

  護喵被同伴弄傷，擔負起導航的重責大任，電影末段的畫面好似象徵牠的羽化成仙；狐猴

  則是保有貪玩的睿智靈長類，懂得使用工具，喜歡各種亮晶晶的東西。牠們的互動並非動

  物星球頻道，而是透過這些展現特質的習性創造出笑料，讓整段漂流趣味橫生。



  既然全片一句對白都沒有，聲音設計就變得極為重要。片中的動物叫聲，都是從真正的動

  物身上錄製下來的。其中，主角喵與好夥伴拉不拉多，甚至是由導演自己的寵物獻聲。《

  喵的奇幻漂流》耗時五年製作，光是錄製動物的各種叫聲，想必就花費不少功夫。另外，

  片中動物們的互動與行為所產生出的聲響，都以相當逼真的擬聲音效來呈現，讓人感覺自

  己真的與這些動物一起坐在船上，經歷這場漂流。最後，當然是營造滿滿氣氛的配樂。每

  當情況緊急，不論是洪水將至，還是航行發生問題，甚至是上岸拜訪時出現危機，快節奏

  的配樂不禁讓人跟著緊張起來。



  除了聽覺之外，《喵的奇幻漂流》也是一場視覺饗宴。雖然是相對低成本的動畫製作，作

  畫上並不完美，但溫暖的筆觸更讓人感受到作品的溫度。畫面呈現方面，觀眾是透過動態

  攝影機的視角來觀看這場冒險，很多長鏡頭讓觀眾近距離地跟著喵到處探索，手持的臨場

  感更讓人身歷其境。雖說《喵的奇幻漂流》並不是一部色彩鮮明的動畫，但不管是白天的

  陽光灑落在青綠的枝枒或翠綠的草地上，還是夕陽所形成的剪影，甚至是在水中與各色魚

  兒悠遊的畫面，都美不勝收，彷彿一幅幅的油畫呈現在觀眾眼前。



  水在《喵的奇幻漂流》中，不但扮演災害的源頭，也帶出許多美麗的鏡頭，同時也記錄主

  角喵的成長。喵從一隻十分怕水的貓，到受困水中後，不得不踏水前進。成功在船上避難

  之後，偶爾也由於在船沿漫步，而跌落水中。從一開始的驚慌失措，到有勇氣朝著目標游

  去，最後甚至擔起為船上動物捕魚的工作，顯然還樂在其中，經過這場漂流，喵已然成長

  不少。牠每一次掉進水裡，觀眾的緊張感就越來越低，從一開始會擔心地一起閉氣，直到

  喵脫離險境，到最後看見牠怡然自得地在水下移動，也能一同感受到牠的開心，這就是成

  長的感覺與意義吧。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
