url: https://www.ptt.cc/bbs/movie/M.1741187571.A.CC3.html
title: '[  雷] 喵的奇幻漂流'
content: '看了2次

  第一次是剛上映的時候

  第二次是得獎之後

  恭喜本片獲得奧斯卡獎


  小抱怨：正片開始前面協力廠商的LOGO動畫實在太多，雖然我知道本片是很多團體的努力，

  但是看久真的小煩躁


  雷文防雷資訊頁





  其實片名就直接爆雷了

  看這部片，有動物，有船

  的確會想到「少年pi的奇幻漂流」



  第一次看這種完全無語言

  無字幕的電影

  如果只看畫面和音效

  會非常無聊

  我服用這部片的方法是隨時在腦中幫這些動物配音

  例如：

  「可惡，那是我的玻璃球，怎麼被你丟到水裡面」

  「這是我們鳥鳥的世界，讓那隻貓進來衝山小」


  而且創作者也沒有詳細說明

  這個世界的背景、架構

  一切都由觀眾解釋


  我自己的解釋是這個星球類似星際效應的第一個星球，潮汐很大(開頭有一艘船在樹上，表

  示該地不是第一次大漲潮了)

  之前曾經有人類文明，但不知為何人類已經離去，只留下片中的其他生物


  至於片中的角色，小解讀

  主角貓：從一開始各種技能都不行，到學會游泳、學會抓魚

  拉布拉多：友好的夥伴，對誰都友好

  狐猴：專注於物質和收藏

  水豚：老司機，推測可能已經見慣潮汐漲退，找了個船就安穩睡，主動把狐猴的寶箱搶走迫

  使狐猴移動到船上

  另外4隻狗：真的就是豬隊友

  大鳥：不好解釋，但是船開的很好



  正是因為需要觀眾自行腦補

  所以每個人的觀看體驗都很不一樣

  這也大概是評審喜歡的原因吧



  --

  為了海報三刷

  片頭無聊數了一下

  包含代理商光年

  竟然有15個LOGO動畫'
