url: https://www.ptt.cc/bbs/movie/M.1741528461.A.288.html
title: '[無雷] 喵的奇幻漂流 得獎片請慎選'
content: '今年開春第一部電影就獻給這部，完全是因為這部片得獎，


  而且看預告貓貓狗狗的頗討喜XD，只是差一點又包場，


  看來上電影院的人越來越少啊，難怪影城一直倒...


  先來講缺點:


  1. 第一點就有點非戰之罪了，這部片比較偏向文藝片或藝術片，


  只不過用可愛的貓狗和動物來作為主角，


  讓看慣了一般電影的我出了電影院只有感覺"我剛剛到底看了啥"...的感覺，


  尤其全片無對話的安排讓這部片更加難懂，但關鍵也不完全在有沒有對話，


  笑笑羊電影版一二集也幾乎沒有對話，但卻沒有看不懂的問題，主要還是劇情安排。


  2. 再來講畫風，我不知道是不是最新的流行，


  主角身上的材質都刻意做成色調分離的質感，呈現一種2D不2D、3D不3D的奇怪風格，


  而且總是一直聯想到影像過度壓縮的斷階現象劣質影像，個人是不喜歡啦~


  3. 最後講動畫製作細節，這部片製作時似乎"沒有"加入動態模糊的效果，


  在靜態影像上或緩慢移動的場景沒有影響，但對於高速移動的場景，


  看起來就比較不流暢，但也是有好處啦，如果粉絲到時候買藍光來，


  即便高速動態場景截圖下來也能得到非常清楚沒有模糊的影像可以當桌布~


  這部片還是有一些優點可講:


  1. 某些場景非常美，音效也做得不錯


  2. 配樂中有很大一個主題大量使用類似管風琴的音效，還蠻震撼的


  3. 角色很可愛討喜


  4. 有送A3海報~


  既然我看不懂，沒什麼資格說這部電影是好是壞，


  不過下次看得獎的電影會更謹慎些就是了...


  對了大家有注意過這是一部沒有演員卡司的電影嗎? 實在是有夠特別啊~


  --'
