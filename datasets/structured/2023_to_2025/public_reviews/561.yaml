content: '爬了文 當然是好雷居多 但發現已經上映了1個禮拜了 文章也不過才10篇左右而已

  其實是國中女同學 (有結婚沒小孩) 在臉書上推薦這部 我才去深入了解

  想請問沒有養過貓 而狗和貓 我也是比較屬於狗派 (有養過狗) 覺得狗比較可愛

  所以像是忠犬小八 心動奇蹟 可魯 馬利與我還是什麼跟狗有關的電影我都看過

  (包括小時候的101忠狗還是101真狗等)


  這樣的我 適合看喵的奇幻漂流嗎? 片長才85分 好像是比較是給小朋友看的

  希望看過的大大幫我解答 謝謝!


  p.s.我雖然比較喜歡狗 但也不討厭貓


  --


  那個....那個.....實現我的夢想(小聲)  摸你的頭  欺負你到哭


