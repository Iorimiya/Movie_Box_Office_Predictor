title: '[好雷] [好雷] 喵的奇幻漂流 '
content: '~~~~~~~~~~~~~~~~~~~ 雷文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  我帶小孩看   小孩給了超高分


  大洪水這個突如其來的大場面

  以及一些神祕的片段(群鹿轉圈、鳥升天)讓孩子看得瞪大眼睛



  鳥升天這一段，小孩一直問我是真的升天嗎

  我想了好一會兒

  因為畢竟影片沒有其他可解釋的巧合

  那麼它就真的是升天了! 是帶有靈性的、是宗教性的暗示

  死了、被某種力量接走…都有可能


  我會解釋成這隻鳥是代表一種神性

  牠救了黑貓，雖對狗群不以為然也讓步救了狗


  升天可能是因為狗群上來之後的混亂

  心累、淡默、或決定讓各自業力引爆


  最後狗群沒有超脫獸性的本能

  而狐猴終於提升了自己



  無來由的大洪水是人生的無常

  就像所有的災難片一樣

  有的角色自私、有的角色在過程中提升

  觀眾一邊看一邊映照著彼此的心靈






  --'
