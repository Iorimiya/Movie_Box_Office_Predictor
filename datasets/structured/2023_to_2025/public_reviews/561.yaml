url: https://www.ptt.cc/bbs/movie/M.1741707181.A.48F.html
title: '[普雷] 《喵的奇幻漂流》貓咪的末世漫遊'
content: '另一種注目，跳脫美式思維的東歐動畫


  最近中國的《哪吒2》動畫，登上全球十大電影，光是中國就貢獻近九成的電影票房，這

  件事受到一些關注電影的群眾熱議。


  在世界動畫電影中，美國與日本幾乎佔據半壁江山，但法國等南歐、西歐國家也時有動畫

  佳作，這讓其他地方動畫第一次有所聲浪所使難得，但票方突出跟人們是否覺得這部動畫

  好看跟有深度幾乎是兩件事，而有些動畫雖然聲勢與資金都無法達到大公司般雄厚，但依

  舊有自己的一片天。


  來於東歐拉脫維亞的動畫作品《喵的奇幻漂流》是一部可愛且有意思的作品。故事無口白

  ，全片以動物為主題敘述．說著一隻灰黑的貓在人類不在的末世裡，因為洪水而跳上船隻

  ，跟著與牠不同的動物們展開一場奇幻的遠洋漂流，從森林進入大海，在到高山，旅途之

  中與最後的盡頭將會如何，貓咪打算用牠大大的黑眼捕捉一切。






  《喵的奇幻漂流》是什麼電影？


  動畫是一種在虛實之間的藝術表現，過去多半稱為卡通的年代，台灣往往將這些動畫或卡

  通作品視作孩子的休閒，其實不只有台灣，就連主流動畫市場的日本過去也是如此看待，

  但隨著一個世代的成長與作品表現與故事結構的多元，興起了「給大人看的動畫」這件事

  情。


  說是給大人看，其實動畫多半並無設定年限歲，不管大人或小孩都可以享受動畫所帶來的

  樂趣，天馬行空，這也是為何如今有時候動畫比真人電影更吸引人的原因，而如今就算真

  人電影也離不開動畫的輔助，來達到我們想要的視覺體驗。


  但動畫的投入其實是一項博弈，甚至不賺錢的行業，如同日本動畫電影雖然有著許多讓人

  印象深刻的作品，但並非有穩定收益。以世界知名的日本工作室「吉卜力」為例，《風之

  谷》和《神隱少女》雖然有著不錯的票房，但極高的人力與時間成本，是否能維持工作是

  長久的營運，或是負擔起不賣座的動畫，是一個問題。尤其在宮崎駿年事已高，同期動畫

  導演離世，接班人無確定的狀況，都讓一個動畫產業面臨到許多，創作以外現實面的問題

  。






  有品質的公司面臨財務上的困難，有名氣與後台的公司同樣也有著劇本故事觀眾不買單的

  問題，例如近幾年迪士尼出品的《星願》就是一項災難。故一些不是以動畫著稱的國家動

  畫或小成本獨立動畫電影公司的作品，是難忍可貴讓人驚豔的。拉脫維亞的《喵的奇幻漂

  流》就是一場相當意外的驚喜。這部動畫初次出現在坎城影展「一種注目」單元，就獲得

  廣泛的好評。簡單的故事與流暢的動畫表現讓這部作品拿下了全球大大小小的動畫、電影

  獎項，也成為拉脫維亞國家值得驕傲的動畫電影。


  這部電影耗費了5年左右的時間完成，動畫原型來於導演齊巴洛迪斯在2012的短片《Aqua

  》，講述一隻對大海有恐懼的貓咪，而《喵的奇幻漂流》也是以這為基礎下的延伸。


  其中導演也表示動畫中的動物動作表現，多是透過自家寵物與動物園的動物的觀察而描繪

  出來，其中也在一些動物上面追加了神話色彩，也來整體的故事更添加一些奇幻性，讓整

  體故事並不是一場單純的現實公路旅行，而更有異色世界的味道，其中動物的行為也加深

  了這樣的表現風格。









  《喵的奇幻漂流》分析與延伸：


  東歐國家在過去都有著共產主義色彩，其主要以當時共產的蘇聯佔領有關。故拉脫維亞也

  不例外，因受共產主義的影響，在藝術與創作的表現上過去受到嚴重的控制，但這並不讓

  拉脫維亞失去有趣且有當地特色的電影和動畫作品，其中動畫技術方面受到俄羅斯與烏克

  蘭等地技術影響，許多藝術家和動畫師也因為技術和與國際接軌，而將自己的想法偷偷帶

  進動畫創作之中，在東歐最著名與特色的「偶動畫」便是如此。


  當時拉脫維亞的偶動畫雖然也需要獲得蘇聯與官方共產主義審查，但始終有著深度的政治

  諷刺，其中一些創作者也獨立創作與展現創意，而這些偶動畫、逐格動畫也帶有每個東歐

  國家的民俗與文化風情，而免於赤化的狀況。


  所以對偶動畫有研究的人表示：如果要說共產主義或蘇聯為何在東歐思想統治的失敗，也

  許得歸功這些地下的盜版西方電影與當地創作者的偶動畫作品，讓人民始終保有對於民主

  與自我國家的認同感，於對共產官方的政治宣傳保持懷疑立場。








  所以我們如果從東歐的政治與偶動畫的方向來看的話，拉脫維亞的電腦動畫實際上是有受

  到過去的偶動畫風格影響，因過去東歐動畫就藏隱含哲學性和成人寓意的敘事，在《喵的

  奇幻漂流》中也的確透過動畫中的動物展現哲學故事，並在娛樂與哲理故事中，可以看見

  東歐與歐系國家的動畫有共通點，是從單純的故事主軸中加入隱喻和象徵性的事物。


  另外一點是東歐有偶動畫的基底，在電腦動畫中會強調關於手作感、超現實與表現主義，

  與西方動畫完全擬真材質的表現略有不同，在東歐如拉脫維亞所表現的風格是真實的手工

  藝感。


  而東歐動畫有趣的地方就在於它一直有一種實驗精神，如同拉脫維亞《喵的奇幻漂流》還

  是採用非人聲的口白敘述，用動作與行為來追進劇情。不明說與交給觀眾自我理解和詮釋

  ，是東歐動畫在過去共產體制經驗下自成的動畫特色之一。故在《喵的奇幻漂流》中一開

  始的無人類只有動物存在的世界是一種反烏托邦或責這才是烏托邦，有著東歐自成的黑色

  幽默。這也是東歐的動畫產業如無論是偶動畫、逐格動畫或電腦動畫，仍有著它一定代表

  與地位。








  《喵的奇幻漂流》值得一看嗎？


  過去曾經修過東歐動畫的課程，也跟來台的東歐動畫研究者有過交流，一直到今偶動畫還

  是東歐，不管是捷克、斯洛伐克、或是《喵的奇幻漂流》的拉脫維亞的代表之一，當然這

  也面臨關於藝術實驗與商業性，還有與全球動畫之間的定位和價值。


  從拉脫維亞展現出《喵的奇幻漂流》的這部作品，可以讓我們看到東歐動畫有它的韌性在

  ，甚至過去的傳統敘事與文化是如何延伸到電腦動畫這一塊，也許比起一些更加商業與全

  球性的知名動畫，《喵的奇幻漂流》稍嫌單調，但我認為這部也是看多各種商業主導或是

  以擬人為主的動畫之外，另一種凝視動畫樣貌的可能性。


  《喵的奇幻漂流》有趣點在於一路上不管是主角黑貓或是它旅途的夥伴，甚至過客和半奇

  幻的生物出現等，展現出一個動物生態與非目的性的冒險。但實際上《喵的奇幻漂流》中

  的動物也非是完全動物本色演出，在整體來說裡面動物所展現的依舊是以人類的面向去詮

  釋的動物行為。著有《五感之外的世界》的獲得多項獎項，與為《科學人》、《國家地理

  》等刊物撰文的科學記者－艾德楊，就曾經在書中表示，動物的感官世界和行為模式，其

  實並不能以人本為為出發點。






  故，動物擬人化其實對於了解動物是危險的，這一點如果以當今人類社會對於動物的看法

  就可以理解，例如大部分的人對於貓、狗等有毛動物常以可愛為出發點，而對於傷害其他

  生物的縱容。


  甚至有可愛而忽略其危險性，甚至以人的想法去看待動物的行為，例如並非所有動物都擁

  有人類的視力或思維模式，但人類往往將動物的舉動做出了人類故事的見解，這點在《喵

  的奇幻漂流》的動物上其實也時常出現，可以說《喵的奇幻漂流》中的動物行為，是基於

  人類喜歡動物這樣而出現的，而讓電影有了趣味與寓言性質。


  也就是《喵的奇幻漂流》根本上還是一部動物擬人的動畫作品，用動物去演出一場符合人

  類期待的末世狀況。這很有趣，但也不免讓人好奇《喵的奇幻漂流》如果真的自己放手讓

  這些貓、狗、猴子與鳥類等，透過AI研究動物行為，讓裡面動物隨意發揮，會不會又會看

  到一些有趣的故事點？整體而言《喵的奇幻漂流》的表現展現的更多事東歐世界的動畫敘

  述模式，在如今美國與日本兩大商業動畫大國中，展現出它藝術價值與魅力，多於動物本

  身，而可以說就算是這樣無人、無對話的故事，只要展現的好，它就是會讓人喜愛的動畫

  良作。




  --

