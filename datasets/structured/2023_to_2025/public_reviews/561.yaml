url: https://www.ptt.cc/bbs/movie/M.1741203643.A.70F.html
title: '[好雷] 喵的治癒漂流'
content: '雷文防雷資訊頁





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  這部被分類在動畫是個錯誤

  有上的影院大多是百貨公司還是平日時段

  很難想像小孩子或情侶看了會說什麼









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  從遭遇順開始看


  狗子群代表的是「多數人」

  從頭到尾沒有做過一件好事

  只看結果的話會覺得這些人還是死光比較好

  但是分析其動機也沒有特別惡意

  就只是傻




  水豚的象徵是「善人」

  他努力行善

  收留所有路過的人

  嘗試找回狐猴的寶物


  但是把船舵搶過來

  造成最後沈船還差點一起下去的人也是他

  這是一個典型沒有好報的好人




  白鳥代表的是「精英」

  他本來生活在一個只有白鳥的地方

  幫了小黑貓一次翅膀就折了

  再也跟不上第一梯隊了


  他上了一條新的船

  努力掌舵努力適應新生活

  但是船要沉的時候個人的努力無足輕重

  最後還是決定登出

  他登出的那個地方也很惡意

  是一座五指山的中指




  狐猴的象徵是「收藏家」

  把裝著彩色星砂和貝殼的玻璃瓶放進籃子裡

  把人生旅途上所有閃閃發光、叮噹作響的東西收集起來


  但是人其實不能真正的擁有什麼

  有形無形的東西最終都會以某種方式離開

  玻璃球也沒有撈回來

  最後只能捧著碎掉的鏡子

  懷念鏡子還沒有碎掉的時候




  到這邊可以看到

  作者剛好列出了四種最常見的答案

  為了生存

  為了成為一個好人

  為了成為人上人

  為了收集美好的東西




  而作為觀眾主視角

  「一般人」代表的小黑貓

  要面對的是象徵「世界」的藍鯨


  以小黑貓的視角來說

  自己快要溺死的時候

  是藍鯨拯救了他

  所以藍鯨擱淺的時候

  小黑貓也磨蹭著想要救他


  但其實一切都是小黑貓的一廂情願

  藍鯨可能根本觀測不到這麼小的貓

  小黑貓也不可能移動一隻藍鯨


  這就是世界

  就像這場週期性的洪水一樣

  只是自然規律

  是你無能為力的東西




  於是小黑貓又回到了第一幕

  凝視著逐漸漫上來的水面


  他們有沒有撐過第二場洪水？

  有沒有找到第二艘船？

  結局沒有講因為這不是重點

  每個人都會走

  只是時間問題


  如果導演足夠煽情

  現在小黑貓就可以對著水面安慰自己

  我這一生遇到了很多人

  還有了珍貴的夥伴

  我不後悔


  但他也明白這騙不了自己

  所以他只能繼續凝視水面

  思考眾生如歸流

  思考生命的無意義

  思考確定不會有答案的思考


  我可以理解為什麼評審想給高分

  他們一定是想起了被存在主義那一類論文折磨的日子

  覺得這麼溫馨治癒的故事不能只有我看到



  --'
