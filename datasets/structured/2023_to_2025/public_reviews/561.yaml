url: https://www.ptt.cc/bbs/movie/M.1740902235.A.F94.html
title: '[好雷] 快速看懂喵的奇幻漂流'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  喵的奇幻漂流

  其實也沒什麼劇情

  就是黑貓小隊的「九九八十一難西方取經記-叢林版」

  一路漂就完事了。


  首先本作有三大體系：


  肉身成聖、陸地神仙：我們的鯨哥就是了，適應版本，數值就是一切，天地之大我鯨爺任

  逍遙，完全不用煉心，堆數值就是一切。


  修仙飛升：我們的鳥哥蛇鷲就是奔著修仙去的，大道無情，救主角僅是順手為之，看著小

  黑喵有點仙緣稍帶一下。自己抓準時機就飛升了。


  照見自我：我們的主角小黑喵也是有點靈性，但最後還是選擇紅塵煉心，跟三個快樂夥伴

  走的是類似小乘佛教的路數，明心見性，修成正果，故事圓滿完結。



  以下是角色介紹：

  按角色強度

  SSS級:鯨哥

  「眾人背後的守護神」

  電影大部分時間的版本之子，肉身成聖，力大無窮，有移山填海之能，救了差點溺死的主

  角小黑貓，後來又小尾巴輕輕一拍，幫助卡住的船前進。


  奈何一代版本一代神，大退潮之後直接擱淺。


  優點：

  無敵，絕境唯一解。

  缺點：

  並未真的加入主角團，僅會偶爾保駕護航。

  後期被重砍一刀。


  S級：

  鳥哥：小船上第二代舵手，孤傲且有能力。為了救主角與族內爭執，被殘酷鎮壓後翅膀受

  損，遂加入主角團。

  目標堅定，船上最可靠的舵手，能打，能捕魚，能掌舵，能撈人。

  能力超群外也極有遠見，早已看出狗子一團成不了大事，奈何主角團不忍見死不救。

  所以這位大佬也不跟你們這些凡夫俗子玩了，時機到了抓住仙緣直接飛升，破碎虛空而去

  。


  優點：

  六邊形戰士，能飛就是強。

  缺點：

  過於孤傲，不會跟你玩球，目標達成後會高歌離席。


  A級：

  卡皮巴拉：

  船長兼三代舵手，人和之神，會游泳，力氣大，能放權。隊伍裡的萬金油，老大哥，溫和

  又會照顧小弟。

  在陸地上略微笨重，結尾被眾小弟所救。


  優點：

  高情商，生存能力跟力氣都高，團隊中最會游泳的，契合版本。

  缺點：

  濫好人，差點被狗子一團雷一波gg。

  打呼聲太大，會有一個影響團隊睡眠的debuff。


  B級：黑貓、拉布拉多

  黑貓：本作主角，初代舵手，看似誰都不信任，實則有情有義，在學會游泳捕魚技能後，

  能力還算不錯。團寵，大家最疼的忙內，危機意識強。

  有仙緣，但仍有凡心，加上不會飛，沒有成功跟鳥哥飛升，救了卡皮巴拉大哥後，看見鯨

  魚的死亡，看清自身河中的倒影，成功與卡皮巴拉、拉布拉多、狐猴一起明心見性，照見

  自我。


  優點：

  可愛、懂事，有靈性，有警戒能力，會幫忙捕魚。

  缺點：

  剛開始戒心太高，難以接觸，力量方面跟戰力趨近於零。


  拉布拉多：

  快樂小狗，無憂無慮，玩就完事了，價值觀比他的狗子夥伴們正多了，屬於是出淤泥而不

  染，能力一般，但有點力氣。


  優點：重情重義，力氣大。

  缺點：略微白目，有時有點煩。


  C級：

  狐猴，跟狗還有鳥哥都是有族群的動物，一開始感覺還是比較心繫同族，有點雷，成天擺

  弄自己那些沒什麼用的破玩意兒，還時常因此跟隊員衝突。沈溺於照鏡子，利己自我。但

  最後覺悟，同拾與同伴的感情，照見真實的自我，跟黑貓算是在劇情中進步比較大的兩位

  。


  優點：手很靈活，可以輕鬆的使用工具，但劇情大部分沒發揮到。

  缺點：也許有用，但故事大半的時間貢獻度很低。


  F級：

  其他狗子

  沒什麼好說的，就是雷，應該讓鳥哥一一啄死。


  優點：體力、力氣。

  缺點：毫無團隊精神。智商、情商低下。





  --'
