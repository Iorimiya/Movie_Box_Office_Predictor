title: '[好雷] 喵的奇幻漂流_reflection'
content: '「一切都在流動，一切都在變化，但我們可以攜手前往歷史大河的河畔。」


  很荒謬的，看完毫無人類對白的《喵的奇幻漂流》，腦中浮現的第一句人話竟然是《血色

  大地》作者提摩希．史奈德（Timothy Snyder）的句子。或許是因為本片誕生自曾經屬於

  「血色大地」的拉脫維亞？無論原因為何，我想這句話很適合作為本片註腳。


  等等，什麼歷史？全片未見半個人影，只有若干文明殘留的遺跡，以及非常動物的動物─

  ─狗像狗，貓像貓，猴子不會說人話，鳥不會開口唱歌，水豚也總是做著非常水豚的事。

  在人類缺席下，哪裡有什麼「歷史」的河畔？


  《喵的奇幻漂流》就是這樣一部奇片，你完全可以單純視為動物友愛的冒險故事，但只要

  你想，隨時能夠多想好幾層，因為觀者畢竟是人。


  是以攜手前往河畔的「我們」，可以指片中同舟共濟的動物們，自然也可以指身為觀眾的

  人類們。要理解凱撒並不需要身為凱撒，因此這部動畫其實仍是在以動物喻人，只不過手

  法高明而沒有過分以動物擬人。


  更進一步說，我認為劇中的動物皆是人類處境的倒影。


  此話怎說？


  這得從全片第一個鏡頭，也就是貓兒在水中的倒影說起。在一部諾亞方舟式的作品中，水

  是貫穿全片的重要意象。水能載舟，亦能覆舟，既是生命的災難也是禮讚，我們能得到的

  結論諸如此類。


  但水也是一面鏡子。如果水是全片最搶戲的意象，那麼鏡子就是水的自然鏡像──更不用

  說劇中還真出現了一面明顯是人類打造的鏡子。


  我想到西方科學家的「鏡子測驗」，根據動物看見鏡中倒影的反應，來檢證人類以外的動

  物有沒有具備「自我」的概念。姑且不論貓狗有無自我意識，至少觀看動物觀看鏡子的人

  類，肯定是有的。


  那麼鏡子倒影究竟映照出什麼呢？我認為是自己與世界的關係。


  《喵的奇幻漂流》前半最震撼我的一幕，莫過於貓兒爬上巨像頂端，首次看見淹沒世界的

  汪洋。那可是多麼大的一面鏡子啊！這幅景象實在難以不讓人聯想到人類與當今自然環境

  （世界）的關係。中國有一句跟鏡子有關的古諺：「以銅為鏡，可以正衣冠；以史為鏡，

  可以知興替；以人為鏡，可以明得失。」如今人與史都不復存在，只留下自然，何妨以自

  然為鏡？


  一切都在流動，一切都在變化，即便人類缺席，但「文明存在過」的存在感卻異常強烈。

  是以我總覺得人類與這場大洪水大概脫不了關係，畢竟現代人類對地球與自然環境的影響

  ，已經大到學者需要提出「人類世」（Anthropocene）的概念來描述。即便人類缺席，但

  人類對環境生態的所作所為，會不會已經大到在後人類時代也影響到貓咪？


  關於生態警世的部分或許可以說是藍色窗簾，是我嚴重3D暈之下注意力不集中所產生的夢

  囈。但我認為全片還有另外一個隱喻，那就是面對生態危機或環境劇變時，我們得發揮同

  舟共濟的互助精神。我們不能只想到自己，還要考慮別人，甚至跨越物種的藩籬。


  再次從那隻貓說起。對貓來說，牠的世界原本很單純，就是牠自己的生存。所以鏡中倒影

  最初只有貓自己，因為只要顧到這樣就可以。


  當洪水來襲，貓兒原本單純的也就跟著翻天覆地。原本無拘無束獨來獨往的牠，不得不跟

  其他物種同舟一起，學會克服恐懼、同舟共濟。一切都在流動，一切都在變化，而流動與

  變化都是成長的一部分。


  同樣成長的還有猴子。猴子不像貓兒藉由水中倒影看見自己，而是追逐人類所發明的鏡子

  ，藉由鏡中之像來打量自己。這讓我想到日本也有一句跟鏡子有關的古諺：「鏡非醒悟之

  器，乃迷惑之器。」這話的意思是，原本用來促使人反省的鏡子，如果使用不當，很有可

  能愈看愈迷惑，顧影自憐而只想到自己。


  這顯然是猴子在劇中泰半篇幅中的寫照。好在猴子最後醒悟，從漂流中悟出了成長與互助

  。所以牠最後放下鏡子，放下追逐鏡子的同類，轉而幫助身為異類的貓咪。


  經過了一場奇幻漂流，動物們都獲得成長，倒影於是不再只有自己，而是映照出家與夥伴

  的形貌，映照出自我與世界的嶄新關係。即便物種相異，卻能在流動與變化中建立互助之

  情。漂流讓動物們變得更有智慧，更具「人性」（這也是為什麼牠們在結尾時愈來愈能做

  出不似真實野生動物的行為）。


  一切都在流動，一切都在變化，但我們可以攜手前往歷史大河的河畔。


  於是我們又回到史奈德，雖然嚴格來說這位歷史學家其實只貢獻了這句話的後半。「一切

  都在流動，一切都在變化」的概念其實出自於古希臘哲學家赫拉克利特（Heraclitus）。


  你可能沒聽過這位仁兄，但應該聽過他最有名的一句話：「每個人都只能踏進一條河一次

  ，到了第二次，河就不再是同一條河，你也不再是同一個你。」經歷了一場漂流，獲得了

  成長，體悟了與世界的全新關係，貓就不再是同一隻貓，觀眾也不再是同樣心態的觀眾。


  正如結尾彩蛋所暗示的，洪水遲早會再來，鯨魚會再次優游，貓與夥伴遲早會展開下一場

  漂流。願我們在那之前，都能攜手從歷史的經驗中學習。


  --

  謝謝各位朋友喜歡，今天這部片獲得奧斯卡最佳動畫電影獎，大恭喜！'
