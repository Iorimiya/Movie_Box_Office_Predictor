url: https://www.ptt.cc/bbs/movie/M.1740291212.A.B50.html
title: '[好雷] 喵的奇幻漂流'
content: '雷











  以水面倒映出黑貓的臉作為開場

  帶出一個時間軸不長的小故事

  電影用漂流而非旅程，是相對更精確的用字


  突如其來的一場洪水

  獨來獨往的貓上了一艘船

  因緣際會和其它動物有了互動

  隨遇而安的水豚，蒐集癖的環尾狐猴

  呆萌拉不拉多，尊爵的蛇鷲


  導演刻意描寫這些物種在普羅大眾印象裡的特色

  貓很貓，狗很狗，猴很猴，鳥很鳥，水豚很水豚

  而觀察在這些各自特色下的互動

  就變成觀賞本片的樂趣之一


  水豚幫狐猴把裝滿金閃閃的籃子拖回船上

  對拉不拉多沒耐性的蛇鷲一腳把球踢到水裡

  黑貓故意讓狐猴拿出來的寶貝貝殼弄掉到船上

  黑貓不吃香蕉，但是水豚很愛

  北七拉不拉多就是個開心派對咖


  毛茸茸的動物本來就受大眾歡迎

  抓住動物的特色，加上適當的擬人化

  讓這部片停留在一個恰到好處的甜蜜點


  也因為特別強調動物的本性

  由柴犬(秋田?)領軍的那三隻患有ADHD的狗

  雖然看起來就是一群來作亂的玩意

  但就也不是甚麼可惡咖，阿狗子不就這樣


  在有限的經費下使用開源Blender製作

  畫面雖然比不上如皮克斯夢工廠的作品

  但絨毛感有做出來，蛇鷲的羽毛在視覺呈現上也相當舒適

  個人是認為這樣就足夠了

  大家看電影不是要數貓毛有幾根

  也不是要看這個海浪做的多逼真

  細膩度和寫實程度不是討論藝術品唯一的指標

  如何的恰到好處，打入人的感官世界也同樣、甚至更重要


  若硬要擠出幾個缺點

  大概是因為動物不會講話

  這部片也沒採用人聲旁白來做台詞的代理人

  看習慣一般電影的觀眾可能精神集中度會較難維持

  建議抱著好好沉浸一趟沒有說教，敘事性不強的電影的心態來看


  另外就是一開頭那些動畫製片的logo真的有點多

  Logo一個又一個，看到有點笑出來

  阿到底是要開始了沒


  結尾卡在樹上的帆船，呼應了開場卡在樹上的小木舟

  也許黑貓曾經經歷過類似的漂流

  也遇上了一些夥伴也不一定

  那些夥伴去哪了?


  不管去哪了，最後積水倒映著四張臉

  黑貓獨行俠還是遇上了新夥伴了


  --

  前幾年對於部分大廠做出來的各種盈利考量縫合怪厭倦後

  這幾年其實一直在找一些獨立工作室的作品

  覺得這類的作品

  創作者透過創意和美感將有限的經費轉化出的藝術呈現

  個人是覺得得到的回饋感相當美好

  可能也是寬容度比較高啦，阿就沒錢阿哈哈

  這部分我個人是給正面評價的

  但感受到周圍其它觀眾不時看手錶，動來動去看手機

  會覺得可能這不是對所有人都是加分項就是了

  小弟沒這能耐XD

  以軟體工程師的角度來看

  開源免費的套件/工具確實都能降低創作的門檻

  畢竟獨立製作最大的問題常常就是資本不夠

  其實也很希望未來像Blender這類的開源工具能夠讓獨立創作開枝散葉

  我看的場次廳不大，總共13排

  第四排的位置應該還算前面

  這部片有晃來晃去會3d暈我也是看報紙才知道

  但每個人體質不同不好說就是了

  我看到的是一艘小木舟，但沒有很肯定是不是橘色的XD'
