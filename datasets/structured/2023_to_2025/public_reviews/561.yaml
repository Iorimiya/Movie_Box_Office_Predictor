title: '[犧牲自己上天堂雷] Flow 喵的奇幻漂流 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  無聊在Netflix打開來看

  大受感動QQ













  1.全片沒有對白

  沒有人類

  一艘破船

  貓 狗 猴子 水豚 鳥

  偶而出來拯救主角的鯨魚海怪



  2.全片最感人的無疑是鳥的故事

  挺身而出

  保護自己並不認識的陌生人

  為此不惜和族人對抗

  結果戰敗

  被族人折斷翅膀

  驅逐離開


  最高潮的地方就是後來鳥獨自站在高塔

  貓去找他

  然後突然間

  周遭的一切都開始升天

  畫面很夢幻 音樂很美麗

  鳥得到救贖

  去天堂了

  貓回到凡間

  跟快樂又沒用的好夥伴們

  繼續流浪



  3.這部片光這個經典片段

  就值得名流影史了

  太感人了

  為不認識的人 挺身而出

  最後得到救贖 上天堂

  永遠用不膩的七武士老梗

  每次看還是這麼感動QQ


  --'
