url: https://www.ptt.cc/bbs/movie/M.1740576181.A.622.html
title: '[好雷]喵的奇幻漂流 有科幻味'
content: '有雷，以下個人解讀






  這部跟以往的的動物片很大不同是很克制擬人化描寫，所以幾乎沒有煽情的蹭蹭、抱抱、舔

  舔，除了動物會開船這種必要設定以外，時不時會有在看動物紀錄片的錯覺


  也因為不刻意擬人，所以片中的角色真的

  得做出一點點友好或付出的行為都會超級感人


  一開場我就在想世界觀設定是什麼樣的，是本來就不存在人類的純動物世界觀，還是人類滅

  亡的後末日設定？


  透過貓貓住的廢屋、木雕，桌上還放著貓貓的素描，可以看出貓曾經是有人養的，而且外面

  還有野化群聚的各類品種犬，所以人類存在過，那麼人類都去哪了？


  劇情多次有貓貓照水面倒影的橋段，我想到動物的鏡子測試，就是測驗動物能不能意識到鏡

  中的動物是自己，來推斷動物有沒有自我意識。


  現實中狗貓這些笨笨動物都是過不了鏡子測試的，不過片中貓貓常常看著倒影若有所思，加

  上為了片子的寓意，我姑且猜測主角貓貓應該知道倒影中的動物是自己。


  這件事說明貓貓心中有「人我之別」。我是貓，你們都不是貓，我們不是同個物種，我只能

  靠自己。這解釋了貓貓一開始對所有角色的排斥和警戒態度，當然現實中的貓也是這麼機車

  就是了。


  傻傻的卡比巴拉肯定沒有這個意識，所以他是老好人，見誰幫誰。狗勾也沒有，只是依據本

  能行動的笨笨狗勾。


  猴子有這個意識，從他照鏡子擠眉弄眼的實驗中可以看出他知道鏡中的猴子是自己，所以他

  也跟貓貓一樣警戒其他動物。當他看到另一船跟自己一樣的動物，他就想要離開主角團回到

  自己族群，只是另一船不要他，估計是他身上沒有漂亮的裝飾所以看不起他。


  鳥鳥本來也沒有人我之別，所以他好心幫助貓貓，卻也因此受到同族的排擠，他是最悲情的

  角色，他不是從鏡子認識到別的物種跟自己不同，而是從「背叛」認識到這件事。


  這也是為什麼後來遇到其他狗，鳥會那麼反對救助，兩個理由，第一是，上次我幫了其他物

  種，結果吃了大虧。第二是，同族的動物也不見得會彼此幫助，隨時可能反咬你一口。後來

  他離開團隊我想也是同樣的理由，看到那些憨狗如自己所想的扯後腿，徹底心寒了。


  到了高山，鳥跟貓遇到神奇現象，奇幻的光芒讓他們漂浮升空，最後鳥獨自飛升不知去向，

  貓貓回到原地。從空拍角度可以看到高地周圍有一圈人工的紋路，加上爬山一路上的人造建

  築，可以推測這可能是一個有功能的人造設施，用途可能就是傳送，人類知道世界即將被大

  水淹沒，所以從這個裝置集體傳送走了。至於貓貓為什麼傳送失敗，可能是傳送需要飛行動

  力輔助，也可能是一次只能傳送一個人，原因不重要，重要的是貓貓目睹了這次傳送過程。


  最後貓貓看到鹿群再次狂奔，他馬上想到洪水即將再次來襲，這時他其實是想獨自逃跑的，

  可以看到他丟下夥伴，獨自奔跑的時候的目光始終看著高山，他是想透過那個裝置把自己也

  傳走。


  不過他遇到奄奄一息的鯨魚，想到自己受過多少幫助才能活下來，頓時放棄了自己獨活的念

  頭。結尾他們四隻動物一起坐在水邊，水面映照四隻長相不同的動物，貓貓一樣若有所思看

  著倒影，但他這時還蹭了一下隔壁的動物，這時我想他的想法可能是，長得不一樣也無所謂

  ，彼此支持、互相幫助的同伴情誼比物種是否相同更重要。




  --'
