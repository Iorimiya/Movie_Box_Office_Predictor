content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n整部作品沒有一句對白\n...或者應該說有，只是不是以我們熟悉的方式呈現？\n\
  \n除卻畫面只有背景音樂、音效和動物叫聲的結果就是半強迫地讓人必\n須更投入在畫面中，才能夠及時捕捉畫面中的龐大訊息量－－像是貓\n的瞳孔變化，像是蛇鷲的冠羽\n\
  \n這使得觀影當下能有足夠的留白讓人自由想像主角群的ＯＳ或是幫他\n們配音，就像回到讀繪本的小時候一樣\n\n這種「維持故事骨架但自由填空」的形式有別於大多數直接「講一個\n\
  故事」的劇情片（有些甚至講得毫無邏輯），讓觀眾能夠一定程度的\n再創作，這樣的體驗是新鮮而且會令人再三回味的。\n\n--\n\n\n\n櫻花翩翩飛舞飄落 把飄搖不定的愛意\
  \     全部擁抱入懷\n你給我的那句堅強的話 現在仍留在心中 櫻花不斷飛舞      \n \n\n--"
