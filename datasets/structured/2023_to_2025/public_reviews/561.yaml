url: https://www.ptt.cc/bbs/movie/M.1740154793.A.74E.html
title: '[好雷] 《喵的奇幻漂流》- 終點只是原來的起點 '
content: '最近上院線的好看動畫片

  推薦給大家


  以下是個人一些觀後想法





  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  《喵的奇幻漂流》 最近終於上映。看完第一印象無疑裡面的場景設計十分厲害，好比101

  大樓曾經是最高，或飛機、太空梭代表人類對天空嚮往與追求，並利用第三人稱的動物開

  啟對於「高度的想像」。



  電影以挪亞方舟式大洪水神話災難，扣合在不斷淹沒的建築與大雕像都變成遺跡，重點是

  裡面完全看不到人，但人曾經存在的想像，於是讓動畫技術的優異，使主角貓咪之動作十

  分鮮活，在電影介於90%-70%真的動物感，而非大多好萊塢動畫的擬人化動物，可能除了

  外型，只剩30%-20%的動物感，於是電影中後段之前的動物們保持著質樸，代替的像是已

  經不存在人類世界的倖存物種。



  私竊以為令人感動的會是如此無人的末世，卻又在盡可能客觀中的一點點主觀殘留的動物

  們視角的好奇之中尋找到的天堂，意味著真的接近了那個天堂，那個地方沒有任何利害關

  係、邏輯問題。故照理說可以，也不太擔心，食物鏈的部分（如《荒野機器人》忽略的因

  果問題）。



  不過，已經太犯規的貓咪設定（況且她的造型瘦小會想到家中旁邊工廠老闆從街頭的營養

  不良鬼門關救回來飼養的小黑仔），末段展現更多人性，描述著同伴般的互助，似乎違背

  著電影初始保持的單純：不應該是動物向人學習，或更慘的是，動物變成了人。



  而應該是，我們向動物學習，學習，純粹、天真，學習在世的功名、建造的偉大奇蹟如被

  洪水般淹沒，可能只是瞎忙一場；甚至學習著小學時覺得操場很大，長大回母校發現只有

  短短一條，可是卻沒發現在怎麼打拼，死前又回到原來的世界，原來發現，根本沒有任何

  洪水，一切都是幻覺（電影）。



  如此解釋了貓咪活動的「尺度」，因為她們根本不可能去那麼遠的地方，或是世界的寬闊

  ，不是遠與近，不是大跟小，而是終點也可能只是原來的起點。




  --


  拉特飯 - 以商業力量進入獨立市場


  --'
