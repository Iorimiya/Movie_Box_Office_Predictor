title: '[新聞] 奧斯卡》貓貓好強！《喵的奇幻漂流》擊敗'
content: '奧斯卡》貓貓好強！《喵的奇幻漂流》擊敗強敵猛奪最佳動畫長片




  自由


  〔記者許世穎／綜合報導〕第97屆奧斯卡於台灣時間今天（3日）揭曉，《喵的奇幻漂流

  》擊退包括《腦筋急轉彎2》、《蝸牛少女回憶錄》、《酷狗寶貝之復仇企鵝》以及《荒

  野機器人》等強敵拿下最佳動畫長片。


  《喵的奇幻漂流》先前已勇奪金球獎最佳動畫片，以及入圍安妮獎最佳獨立動畫電影、最

  佳導演、最佳劇本三項大獎。該片同時代表拉脫維亞角逐本屆奧斯卡最佳國際影片。


  劇情描述當世界即將走向末日，卻充斥著人類存在的痕跡，一隻黑貓的家園被大洪水摧毀

  後，登上一艘小船當作它的避難所，但卻發現船上住著各式各樣的動物，儘管他們無法溝

  通，但仍必須合作，穿梭於神秘的漂流世界，面對各種挑戰和危險。電影全片無對白，彷

  彿跟著動物視角進入牠們的世界，導演金茲斯巴洛迪斯上台領獎時不忘感謝自己家中的貓

  狗，相當可愛。《喵的奇幻漂流》全台上映中。


  --'
