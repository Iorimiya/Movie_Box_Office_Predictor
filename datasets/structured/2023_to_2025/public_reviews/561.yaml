url: https://www.ptt.cc/bbs/movie/M.1741103169.A.5BF.html
title: '[喵雷] 喵的奇幻漂流'
content: '個人不感到平淡，音樂跟畫面都挺大氣的，淹水跟水退時很壯觀，主角喵經常落入生死關頭，這趟旅程下來不知道牠的九條命還剩多少。故事寓意我不想思考太多，不必思考內涵也是挺有趣的作品。


  電影剛開始時貓狗水豚的行動模式跟智力都很一般動物水準，汪洋裡一閃而過一個人型雕塑後，船上的動物漸漸有點人味，懂得掌舵，也開始有各種情感互動。


  貓挺多話的感覺像被人類養過 ，但是情感淡薄，跟舊居的玻璃球重逢時沒有太多情緒變化，在船上一開始也是不想跟其他動物有太多瓜葛。

  牠的轉變發生在被鳥拯救之後，對恩鳥產生崇拜感，會想學鳥的站姿，會分享獵物，會對敵對的狗群給予慈悲。後來也是追著鳥往高山去，不過貓放不下船上的同伴，最後沒有升天。



  鳥則相反，為了幫貓而被逐出群體。牠被趕走後就一心想往高山去所以成為掌舵者，對船上其他動物保持冷淡。原本以為牠的家族在高山那兒，牠是想過去團聚，沒想到是去獨自升天了。不知這舉動是獻祭換取退水？還是身心受創後想離開這世界？


  猴子這個群體懂得打扮自己，熱衷蒐集華而不實的物品，最後啃著蒐藏品充飢真是可憐又好笑。最後牠拋棄收藏品，知道誰才是真正的同伴。


  水豚君，好好先生，一直都很友善，蒼蠅都很喜歡跟著牠。


  狗狗，也是沒有界限感的友善角色，不會主動行動，忘記牠對照鏡子是什麼反應了。雖然跟鳥一樣被同伴捨棄，不過牠選擇跟其他動物成為好友，也為這些好友付出全力。


  鯨魚跟鹿像是海洋跟陸地的象徵，淹水沒有把鹿群溺死，擱淺的鯨魚在下一次洪水到來也許就能自由行動吧？貓看著鯨魚又看向山，在思考讓鯨魚飛升得到解脫嗎？


  兔子跟魚不像會思考的動物，應該只是陸地跟水裡的糧食。




  -----

  Sent from JPTT on my Google Pixel 8a.


  --'
