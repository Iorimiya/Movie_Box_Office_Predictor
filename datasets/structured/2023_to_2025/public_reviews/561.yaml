url: https://www.ptt.cc/bbs/movie/M.1736315983.A.E9D.html
title: '[好無雷] 【喵的奇幻漂流】冥想一場生命救贖'
content: "‧\n\n水，可以是汪肆浩渺的洪水之災，也可是孕育萬物的生命之母；這場災難打亂了一切平穩\n生活，毀天滅地之際，生命的流動卻一如既往，貓搭上的小船，進入了一個牠從未了解的\n\
  新社會。\n\n洪水流經淹沒許多人類建築，我們無法得知在這個世界中，人類對於自然是何種角色，我\n們沒有得到解釋，究竟人是條污穢的川流，或是與萬物和諧共處？\n\
  \n但在這一葉小船上，可以看到類似似一個人類社會群體，有天性多疑、有穩重守護、忠誠\n良善，焦躁不安，也有個人主義、唯物主義、部落排外思想，這些擁有不同元素的動物們\n\
  ，彼此都是彼此的負擔，卻也是互相的救贖。\n\n\n‧\n\n【喵的奇幻漂流】是一場充滿冥想式的哲學之旅，他有時如同尼采對真理的批判，有時卻\n像創世紀聖經的闡述，在船內的人都經得起審判的救贖理論，但更多的是，因情感發展出\n\
  團隊及社會凝聚力，而將這樣的力量轉換為一種社會紐帶。\n\n在船中的動物，各自擁有自我，動物本能反應代表原始的自我；但也因此互相輕視，但這\n趟旅程卻讓他們學習將彼此負擔轉為了共擔，從重視自我變為互相支持的共存。\n\
  \n「你們各人的重擔要互相擔當，如此，就完全了基督的律法」 - 加拉太書六章2節\n\n\n‧\n\n天性多疑的牠，逐漸選擇相信而成長，從他人的負擔中解脫。\n\
  \n好吃懶作的牠，關鍵時刻卻是可靠的團隊看護者。\n\n焦慮不安、唯物主義的牠，經常看著鏡中可愛漂亮的自己，但最後才發現自我內心。\n\n忠誠樂觀的牠，無論如何都充滿善良之心，朋友有難時，絕不放棄離開。\n\
  \n威嚴莊重的牠，雖然有著排外主義，但最後仍然因為心中充滿愛，剎那成為永恆。\n\n當世界崩落時，水流不斷衝擊心的交流，動物們不斷看向水中倒影的自己，如同尼采所說\n\
  「人生是一面鏡子，我們努力追求的第一件事，就是從中辨認出自己」。\n\n\n‧\n\n這一場像是諾亞方舟的末日審判之旅，卻也像少年PI的心靈澄清，精美的動畫場景，彷彿\n\
  為大銀幕而生，充滿冥想沉澱的背景音樂，讓所有人陷入那片森林之中；這部電影也許沒\n辦法帶給觀眾爆米花的娛樂，也或許節奏上緩慢如澶湉水流，但其深度如海的劇情，才能\n\
  激起美麗的浪花；劇中無任何台詞對白，動物的聲音都是採取真實配音，甚至水豚君都是\n由工作人員搔癢牠，讓水豚君發出聲音而錄製完成。\n\n寧靜、溫柔、成長，是我認為本片的三大核心，寧靜的自然之音讓人沉靜、溫柔的鯨魚守\n\
  護生命生生不息、成長的彼此，是溫暖的依靠，【喵的奇幻漂流】也許不會讓你開懷大笑\n，也或許不是部人人都能接受的動畫作品，但卻是能夠極為沉澱心靈，以寧靜的心態處於\n\
  這片森林及海洋之中，而久久無法忘懷。\n\n\n*有一個片尾片段\n\n\n‧ \n\n\n‧ 電影資訊\n\n| 發行片商 ：光年映畫\n| 主要演員 ：#貓\
