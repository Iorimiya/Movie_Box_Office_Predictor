url: https://www.ptt.cc/bbs/movie/M.1740672086.A.95F.html
title: '[好雷] 《喵的奇幻漂流》觀察、理論與感想'
content: '個人的《喵的奇幻漂流》觀察、理論與感想

  *以下為深度劇情討論和個人理論，建議看完電影再看。

  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  一開始黑貓獨自看著自己水中的倒影，之後初次遭遇了狗群。


  我們看到黑貓走在森林中往小屋前進，越靠近小屋四處就有越多貓的石像，遠景也有個非

  常巨大的貓山雕像（靠近看它有鷹架，所以確定這是人為的建築），黑貓熟門熟路的從破

  窗跳進森林小屋中休息。


  接下來進Flow標題字卡，下一幕黑貓又在森林中漫步，注意畫面一開始「左側的樹枝上就

  已經卡了一艘小船」，這讓我靈機一動大膽推測，「洪水並非第一次發生，在這個世界觀

  中，大洪水可能是間歇性的發生」，這解釋了為什麼遺留不少人類遺跡、產物，但卻看不

  到人類的蹤影，因為人類的身體能力和生存能力可能沒有動物那麼強，在這前提下再去注

  意森林四處的貓石像，會發現上面佈滿了青苔，如果只有這個單一因素的話不足以判定"

  間歇性洪水理論"，但若加上樹上的小船就不一樣了。


  第一次看我最初假設小屋是黑貓主人的，因為桌上有貓的素描，但看完電影後覺得黑貓一

  路的反應感覺是初次體驗洪水來襲，如果搭配"間歇性洪水理論"，那麼素描畫的可能是黑

  貓的父母輩，黑貓可能沒見過小屋的主人。

  伴隨著奔逃的鹿群，洪水襲來，這一幕讓人聯想到獅子王的牛羚狂奔。


  片中角色最耐人尋味的就屬蛇鷲，充滿了宗教性的象徵，會飛所以最不受洪水影響，完全

  可以獨善其身（事實上鳥群也是持特權階級排外、拒絕分享資源的態度）

  但其中一隻卻對黑貓產生了興趣，挺身相助，而遭同伴打傷驅逐，個性務

  實傲嬌，後期遇到白目狗群他不想救（卻拗不過同伴的善意），事後看來是正確的選擇，

  說明了對爛人仁慈就是對自己殘酷。

  在最後升天的高臺，個人毫無根據的猜測，是這個世界的最高點，地面上刻有一些神秘咒

  符的痕跡，黑貓和蛇鷲抵達祭壇中心後，被未知的力量召喚漂浮空中，出現了類似極光，

  我初看時覺得是什麼神秘的力量或外星人，後來看到有人提出挪亞方舟、自我犧牲獻祭的

  說法也是蠻有意思的思考角度，極光帶走了蛇鷲之後，達成這次洪水的循環，一陣子後就

  開始退水。


  洪水可能象徵反應了地球暖化的環保意識，或諾亞方舟神話的Reset象徵。（大洪水是世

  界多個民族的共同傳說，美索不達米亞、希臘、印度、中國、馬雅、臺灣等各民族中，都

  有洪水滅世的傳說）


  第三幕退水後，尋找夥伴的合作救援行動，真的非常緊湊、緊張。

  雖然最終救不了一路暗地照應他們，像恐龍般的遠古鯨魚，但一開始個人主義的小黑貓，

  過程中克服自己怕水的恐懼，也漸漸學習到適度依靠同伴的重要性；盲從群體的黃金獵犬

  ，學會了要稍微獨立一點，慎選自己的同伴；收集癖的狐猴稍微擺脫了物欲的執念，意識

  到比起物品，一路走來的同伴才重要；善良、充滿包容的水豚倒是一以貫之，最後水中的

  倒影，終於不再是一個人了。



  *片尾彩蛋是又見水中出現了遠古鯨魚的鰭，暗示著它沒事，也某種程度證實了大洪水的

  間歇性，另一方面片中由Florent Desailly設計，恐龍般造型的鯨魚跟真實鯨魚滿不一樣

  的，有很多類似腳的鰭(?)，還有三道很明顯的鰓，那是否為適應了間歇性洪水環境的進

  化? 也許能夠在陸地上呼吸? 甚至某種程度緩慢爬行? IDK

  它太巨大了，動物們即使想幫忙也真的沒有能力救它，但也許它並不需要等著被救?



  《喵的奇幻漂流》真的好看，非常喜歡&推薦!

  難怪會在某些地方被列入最佳影片組，他們用免費開源軟體做出的CG特效，表現水流和土

  石的效果很不錯，滿逼真的，但在細節和某些質地(如毛皮)部分，老實說如果跟皮克斯這

  類大廠相較下，確實是相對粗糙，偏3D遊戲動畫感，但也堪用了，人腦可以自行補完和適

  應，而且如果考量到制作成本和人力，CP值真的是超強的。

  這部電影最厲害的部分是在說故事的節奏掌控，完全引人入勝，徹底掌握了觀眾的情緒，

  讓人投入在乎每個鮮明的角色，即使沒有對白也能完全能理解他要表達的，劇情緊湊，沒

  有一刻覺得無聊，對動物生態習性的觀察與描寫相當細膩，導演和Rihards Za譃pe合作

  譜寫的配樂也非常好聽，在奧斯卡提名的最佳動畫中，個人評價直接躍升第一。


  後來調查一下，發現導演Gints Zilbalodis真的是怪物等級的天才，2019同樣無對白的前

  作《Away》是他"一個人"編、導、編輯、配樂、製作完成的75分鐘動畫，而且他很多技能

  還是自學的。(我覺得疑似有高功能亞斯傾向)

  現在國外很多地方都準備重新上映《Away》，國內片商不知道要不要響應一下


  《喵的...》擴充改編自導演12年前的短片《Aqua》



  --'
