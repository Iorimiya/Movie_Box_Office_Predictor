title: '[  雷] 喵的奇幻漂流'
content: '臉書最近一直跳這隻喵，週三劃位昨天上午看完，專程去看這隻黑喵



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其他版友的電影分享更詳盡細緻，文筆不佳我只分享觀後感想。


  喵的奇幻漂流，是疫情後我第一部電影，為了這隻黑喵特地去戲院，吸引我的不只是這隻

  善良聰明有義氣的黑喵，愛睡覺的水豚君、傻B阿金、個性調皮愛美的狐猴、犧牲小我的

  蛇鷲（還有欠修理的惡霸狗群跟努力生存的鯨魚），這些動物角色分明，影片中的動物行

  為非常貼近真實，像是傻B阿金要蛇鷲陪他玩你丟我撿，我個人很喜歡這種真實真摯的動

  物特性描繪，自然不造作，也能感受到導演的用心，讓動物回歸最原始自然的本能。


  動畫色彩鮮明，但如要跟大製作的迪士尼相比，當然還是略遜一籌，本片運用免費軟體bl

  ender製作，有限的預算下運用免費軟體創作出這樣的視覺效果，讓人驚艷，華麗的水中

  世界、色彩繽紛的魚群，讓人享受這絢麗的海洋世界。片中無對白，我覺得這點蠻好的，

  讓觀眾對於劇情發展可做更多的聯想與猜測。另外，動物們齊心合作度過難關的精神，以

  及不顧一切也要拯救朋友的義氣，我就是欣賞他們的單純與可愛！


  有的人看完可能會覺得無聊（我室友），但我就不愛話太多的動畫，也不喜歡勾心鬥角的

  劇情，畢竟這個社會已充斥太多複雜與無奈，如果你愛貓，喜歡純真的小動物，喜歡動畫

  ，不喜歡過多的對白，喜歡有點寓意的小品，這部喵的奇幻漂流會是你的最佳選擇！



  --'
