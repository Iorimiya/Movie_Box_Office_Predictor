url: https://www.ptt.cc/bbs/movie/M.1748520503.A.427.html
title: '[新聞] <寶藏獵人>重現埃及古文明在法國驚世之謎'
content: '新聞網址：



  結合古埃及歷史謎團與現代尋寶冒險，宛如《印第安納瓊斯》（Indiana Jones）再現的

  最新冒險強片《寶藏獵人》（Treasure Hunters: On the Tracks of Khufu），即將在6

  月6日於台灣震撼獻映。本片由法國女星芭芭拉史爾茲（Barbara Schulz）首度演而優則

  導，熱愛考古、歷史元素的她，對於冒險電影擁有極高要求，希望透過稍微改編真實事件

  來建構電影內容，打造出虛實融合的故事。劇組為此不僅進行大量歷史考證，更請到學者

  們驗證資料的正確性。此外，劇組也遠赴開羅實地拍攝，與專家學者及博物館合作，力求

  細節到位，其中更巧合發現一個拍攝場景，竟是片中關鍵人物「羅浮宮第一任館長」的故

  居。這項意外巧合，也讓導演驚呼：「幾乎有一種感覺，我真的像是要找到寶藏了！」值

  得一提的是，本片在國外上映後也廣獲好評，是台灣觀眾今年不可不看的尋寶強片！





  《寶藏獵人》是法國女星芭芭拉史爾茲出道30年來，首部的導演之作。熱愛考古、歷史、

  探險、尋寶元素的她，對於冒險電影有極高要求，希望能從真實事件出發，透過些微改編

  ，打造出虛實融合的冒險故事，她對此表示：「對於劇情的設計，我有很高要求。有點像

  丹布朗（Dan Brown）在製作《達文西密碼》（The Da Vinci Code）那樣，拿一些真實元

  素，再包裝成虛構故事，讓觀眾會在某些時刻忍不住去查證資料，結果發現居然是真的，

  這樣就更引人入勝了！」為此，劇組進行大量歷史考證，請到歷史學者確認關於拿破崙的

  細節，以及埃及學家監督，以確認資料的真實性。全片對於考證的細緻程度，就連專家都

  忍不住大力稱讚，讓導演對此分享：「埃及學家尚紀堯姆奧萊特佩爾捷（

  Jean-Guillaume Olette-Pelletier）對我說過一句非凡的話，他說：『你們所創造的內

  容，讓我覺得埃及豔后的木乃伊很有可能就被埋在巴士底監獄下。』」





  橫跨法國與埃及，融合真實歷史與虛構故事的《寶藏獵人》，為講求真實、力求細節到位

  ，在還原方面煞費苦心，不僅遠赴開羅實地拍攝，向埃及學家借用許多收藏品，使用忠於

  時代背景的古埃及文字，同時也與德農博物館合作，特地打造兩件精細的複製品用於片中

  。其中，他們更巧合發現，片中一個拍攝場景，竟是片中關鍵人物「羅浮宮第一任館長」

  維旺德農（Vivant Denon）的故居，讓導演芭芭拉史爾茲忍不住驚呼：「這個巧合令人相

  當震驚，巧合到讓我幾乎有一種感覺，是我真的像是要找到寶藏了！」



  值得一提的是，本片於國外上映後也廣獲好評，觀眾紛紛盛讚：「首度執導就交出一部成

  功作品，是一場聰明、有趣且不受拘束的考古尋寶之旅！」「百分之百被吸引！節奏緊湊

  ，一刻都不停歇！」「沉浸在解謎過程中！」「是不容錯過，全家必看的電影！」同時也

  是台灣觀眾今年不能不看的尋寶冒險強片！



  這部富含歷史與想像力的冒險尋寶強片《寶藏獵人》，即將在6月6日於台灣隆重獻映。本

  片劇情描述相傳，古埃及法老「古夫」的驚世寶藏，曾在拿破崙遠征埃及時期被發現，並

  被悄悄運回法國，藏匿在巴黎某個隱秘角落。時至今日，一位作風離經叛道的考古學家克

  里斯（法布萊斯魯奇尼飾演），在開羅的一次挖掘中，意外發現一段神秘文字。這段文字

  為傳說添上真實線索，更點燃他的尋寶意志，讓他決心揭開這個失落的寶藏謎團。他找上

  許久未聯繫的女兒伊西絲（茱莉亞皮雅頓飾演）和孫子朱利安（加夫里爾達特維勒飾演）

  ，三代組成「冒險小隊」，從羅浮宮深藏不露的機密檔案館，一路追查到拿破崙昔日情人

  所居住的馬爾梅松城堡密室。在這場關於信念、家庭與歷史真相的冒險當中，三人能否破

  解重重謎團，成功揭開失落已久的21世紀最偉大寶藏真相呢？



  欲知本片最新消息，

