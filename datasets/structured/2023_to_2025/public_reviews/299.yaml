url: https://www.ptt.cc/bbs/movie/M.1749036514.A.AA0.html
title: '[新聞] 威尼斯影帝寵妻演【寶藏獵人】秀精采即興'
content: '新聞網址：



  由法國女星芭芭拉史爾茲（Barbara Schulz）首度執導，融合真實歷史與虛構故事的最新

  冒險強片《寶藏獵人》（Treasure Hunters: On the Tracks of Khufu），即將在本週五

  （6/6）於台灣隆重獻映。片中作風獨特、充滿熱情的考古學家，導演芭芭拉打從一開始

  便希望由「威尼斯影帝」法布萊斯魯奇尼（Fabrice Luchini）飾演；從未想過能演出這

  類角色的法布萊斯，看著妻子著迷於本片劇本，因此決定接演。接演之後，他也立刻投入

  角色當中，甚至主動加入許多即興表演。至於片中與主角一同踏上瘋狂尋寶之旅的女兒伊

  西絲，則由法國女星茱莉亞皮雅頓（Julia Piaton）演出。她認為本片不僅適合兒子觀賞

  ，更因為有機會詮釋考古學家而感到興奮不已。不過拍攝時，她卻因為幽閉恐懼症，面臨

  相當大的挑戰。值得一提的是，這也是法布萊斯與茱莉亞首度合作，兩人初見面後的第一

  場戲，茱莉亞就必須開車載他繞行巴士底廣場，超怕出車禍的她，焦慮到苦喊：「如果第

  一天就撞死法布萊斯魯奇尼，那會出大事！」





  出道30年的法國女星芭芭拉史爾茲，首度擔綱導演的新片《寶藏獵人》，請來「威尼斯影

  帝」法布萊斯魯奇尼，化身考古學家解開埃及寶藏之謎。芭芭拉認為法布萊斯和本片主角

  有些相似，他們在自己的專業領域都充滿熱情、閃閃發光，所以從一開始便認定這個角色

  非他莫屬，並發出邀約。一開始收到劇本的法布萊斯，從沒想像自己能演出冒險家這樣的

  角色，但為何最終他仍點頭接演？他對此透露：「我的妻子非常喜歡芭芭拉的劇本，她喜

  歡這樣的尋寶與冒險故事，而《寶藏獵人》的情節非常讓她著迷，所以我覺得這一定是個

  很不錯的劇本！」



  接演之後，他立刻投入角色，深入研究劇本、鑽研語氣變化，更自主在片場加入許多即興

  表演，讓導演對此驚嘆：「我合作過很多搭檔，但很少見到像法布萊斯工作那麼投入的人

  ，每次拍攝都與眾不同。他有時會打電話給我，建議用某個詞代替另一個詞，完全沉浸在

  角色當中，而且即興能力令人驚嘆！」





  《寶藏獵人》精彩上演一段家族三代共同探險的瘋狂尋寶之旅，劇組請也請來法國女星茱

  莉亞皮雅頓與法布萊斯魯奇尼飾演父女。讀完劇本，她立刻決定演出，並表示：「劇本的

  真誠讓我感動，而且背景還有埃及，有異國情調的感覺。我當時就想，這部電影可以拿來

  給我兒子看，他會喜歡、著迷，這個念頭激勵了我！」同時她也對演出考古學家感到興奮

  ，分享：「我超喜歡這個設定，覺得是很高級的職業！我常常送我兒子挖寶小玩具，敲開

  有恐龍骨頭這類小東西，但最後每次都是我搶來玩。」不過在拍戲過程中，她因為有幽閉

  恐懼症也面臨重大挑戰，她對此分享：「有一場崩塌戲，在爆炸後以白色煙霧在隧道中形

  成，我們得摸索前進才能出來，那段時間對我來說非常漫長！」



  值得一提的是，本片也是法布萊斯與茱莉亞的首度合作，兩人初見面後的第一場戲，茱莉

  亞就必須開車載他大繞巴士底廣場。超怕出車禍的她，焦慮到苦喊：「如果第一天就撞死

  法布萊斯魯奇尼，那會出大事！」雖然兩人剛開始的氣氛相當緊張，但之後法布萊斯就常

  常送她書、一起討論內容，進而拉近彼此距離，讓她笑說：「我們就像是在《春風化雨》

  （Dead Poets Society）裡，老師想要幫助學生一樣。他是個熱愛歡笑與分享的人，我想

  他拍這部電影是真的非常開心！」



  這部富含歷史與想像力的冒險尋寶強片《寶藏獵人》，即將在本週五（6/6）於台灣隆重

  獻映。本片劇情描述相傳，古埃及法老「古夫」的驚世寶藏，曾在拿破崙遠征埃及時期被

  發現，並被悄悄運回法國，藏匿在巴黎某個隱秘角落。時至今日，一位作風離經叛道的考

  古學家克里斯（法布萊斯魯奇尼飾演），在開羅的一次挖掘中，意外發現一段神秘文字。

  這段文字為傳說添上真實線索，更點燃他的尋寶意志，讓他決心揭開這個失落的寶藏謎團

  。他找上許久未聯繫的女兒伊西絲（茱莉亞皮雅頓飾演）和孫子朱利安（加夫里爾達特維

  勒飾演），三代組成「冒險小隊」，從羅浮宮深藏不露的機密檔案館，一路追查到拿破崙

  昔日情人所居住的馬爾梅松城堡密室。在這場關於信念、家庭與歷史真相的冒險當中，三

  人能否破解重重謎團，成功揭開失落已久的21世紀最偉大寶藏真相呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
