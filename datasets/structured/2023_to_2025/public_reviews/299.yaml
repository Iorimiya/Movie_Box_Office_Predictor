url: https://www.ptt.cc/bbs/movie/M.1749745897.A.102.html
title: 'Re: [ 好雷] 寶藏獵人-意外好笑的法國喜劇'
content: '昨天因為這篇好雷，

  怕冷門片下檔得快所以今天就進場了


  這篇心得的描寫，我想直接爆雷

  畢竟法國片嘛

  會進場的電影痴不太需要心得文

  不會進場的觀眾也不怕被爆雷

  需要心得的是近年被爛電影浪費太多時間，要看到好口碑才願意進場的老觀眾們



  這部片的TA:

  1. 探險精神

  2. 合理的解謎

  3. 法式的不拘與浪漫

  4. 深度考據的細節和道具

  5. 平順卻真實的劇本


  不該期待：

  刺激動作、正邪對抗、懸疑驚悚



  OK

  上述元素如果喜歡，就可以進場看了

  持平或沒興趣的就自己評估，我猜差不多是年底回顧時不會記得自己看過這部


  簡略內容：

  故事設定在近代法國的考古一家

  阿公是個熱愛埃及文化的考古學家兼探險痴

  女兒是政府考古部門的公務員

  女婿是羅浮宮的館長

  孫子是搞笑/運氣擔當


  阿公在埃及金字塔裡找到寶藏的線索

  發現盜墓者是拿破崙與他的親信維旺德農

  而拿破崙可能把寶藏藏在法國

  一家人透過翻書、羅浮宮找資料、夜闖博物館、挖墓解謎最後找到寶藏



  心得：

  電影改編自類似的真實故事

  通常改編真實故事的劇情都不會太曲折離奇

  整體來說是非常平順的敘事

  只是我就喜歡這樣老派的電影

  （誰叫現在有太多連故事都講不好的…


  好處在於

  劇組能花很多心力在真實度的考究、歷史的串連

  很多推理都跟歷史事件不謀而和：拿破崙百日復辟、巴士底監獄的興建、悲慘世界的背景


  考古劇最怕的

  就是觀眾要內建超多深度知識

  這部關鍵推理都只會用最簡單合理的部分

  淺到孫子直接問：拿破崙？拿破崙是誰？

  酒館旁邊的路人直接轉頭問：「你是認真的嗎？」

  而對於深度細節控，導演則用對話與畫面埋彩蛋呈現，我覺得很棒



  另外人物刻畫方面

  我喜歡阿公那種對事物的熱愛、對未知探險的執著、對生活的浪漫

  那是種很純正的法國精神（大概吧

  至少我去旅遊的時候有深刻感受到那個氛圍

  很難形容 懂法國的人應該知道我在說什麼



  嗯 想分享的差不多是這樣

  對到電波的話大概值8分，沒對到就隨緣


  --

  看完喜歡的話也歡迎分享～

  沒錯歐洲片的節奏跟好萊塢很不一樣

  需要習慣一下

  我自己是看膩了好萊塢的公式化

  偶爾換換口味還蠻開心的哈'
