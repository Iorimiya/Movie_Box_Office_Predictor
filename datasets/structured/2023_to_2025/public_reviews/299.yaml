url: https://www.ptt.cc/bbs/movie/M.1749360677.A.B3C.html
title: '[ 好雷] 寶藏獵人-意外好笑的法國喜劇'
content: '微雷




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  昨天終於有短暫的空閒可以放鬆一下，去看了法國電影＜寶藏獵人＞

  超級好看。。。

  。

  本來以為是嚴肅的考古劇情

  但我看預告片其中一句話女兒對警察說明她爸爸（著名考古學者）是個做事嚴謹的人


  實際上她爸做事超沒章法，她全家都熱愛考古冒險。

  立馬決定就是這部了

  果然不到100分鐘的法國片

  沒有失望的緊湊劇情

  超多笑梗

  跟著考古老爸從埃及到巴黎羅浮宮再到。。。（中間省略好幾個點）。。後來居然連巴黎

  下水道也進去了

  真的好好笑喔。。。。。

  最後還呼應我的愛-丁丁歷險記。

  笑死


  --'
