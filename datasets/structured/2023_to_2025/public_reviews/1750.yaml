  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n     未看過七月與安生\
  \   不過韓國版本看下來 蠻符合口味的\n\n     這種走心的內容  韓國編的內斂很多 感動就會真實\n\n\n     如果說有平行宇宙  高夏闇從沒遇見過安微笑\n\
  \n     那麼 高夏闇的一生就是像普通人一樣 升學 戀愛 結婚 生子 過一生\n\n     然而  就是遇見了安微笑  她們之間的愛 超越了友誼 親情甚至男女私情\n\
  \n     造就了高夏闇不一樣的人生\n\n\n     然而 高一直不理解自己與安之間的關係 改變了她的本質\n\n     所以高在結婚前仍然走著升學 當老師\
  \ 結婚的路\n\n      但高安之間 卻因此產生了愛恨\n\n     原因就在於高 安兩人本身能力不同 而高走的是別人期待的路 安走的是自己的路\n\n\
  \     直到高結婚當天 她才覺悟到 自己在自欺欺人\n\n     於是她逃婚開始走自己想走的路\n\n     最後發現懷了孩子 去找安幫忙\n\n  \
  \   不過電影不是悲劇不成故事 所以高死於27歲\n\n     而安原本只打算活到27歲  為了孩子只好忍著悲傷活下去\n\n\n     兩人情誼的關鍵點在於男主角\
  \  但高始終最愛的還是安\n\n     會跟男主角論及婚嫁也只是走別人期望的路罷了\n\n\n     其實27歲能找到真實的自己不算太晚 只是不拍成悲劇就不好看了\n\
