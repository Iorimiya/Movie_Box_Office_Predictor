url: https://www.ptt.cc/bbs/movie/M.1681401841.A.957.html
title: '[好雷] 漫長的告白：《靈魂伴侶》 '
content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n\n　　　　圖文網頁版：\n\n　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\
  \n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n漫長的告白：《靈魂伴侶》\n\
  \n\n\n　　先自承沒有看過《七月與安生》，無論電影或小說，看過《靈魂伴侶》\n\n之後大概也不會去看──雖然看過影評，都把詮釋的重點放在兩位女主角的\n\n\
  「友誼」，但韓國這部翻拍的電影加入了繪畫的元素，在情感面上，如同\n\n〈童女之舞〉每一塊碎片的中心是最末終於出聲的「不可以」，以及《燃燒\n\n女子的畫像》繪出兩人關係裡愛情與自由的渴求：「你在觀察我的時候，我\n\
  \n也在看著你」。在創作面上，她們一前一後，將心中所愛的一切帶到這個世\n\n界上，使其在消失前的樣貌獲得永生。\n\n\n\n　　《靈魂伴侶》從畫眼睛為始，然後微笑看著自己的畫，回想起來，就是\n\
  \n高夏誾（全昭霓飾）對安微笑（金多美飾）說不出口的，漫長的告白。兩人\n\n在１９９８年夏天初識，與母親有齟齬的微笑進了轉學的教室，還沒坐上指\n\n定的位子就逃跑，但逃得再怎麼遠，即使天涯海角，最終仍須回到母親身邊\n\
  \n──這是微笑對愛的無能為力，自始如此，至終亦然。只有夏誾會找她，記\n\n得她的名字。微笑說，你是夏日銀河──在她心裡始終燦爛；夏誾問她叫微\n\n笑，為什麼都不笑？她說，要微微的笑，不能被發現──只有夏誾發現。之\n\
  \n後她們一起回家，收養了一隻淋雨的小貓，取名「媽媽」，就可以溫柔地叫\n\n她。她們一起洗澡，微笑說怕悶熱，長大不穿胸罩；她們一起吃飯，分別吃\n\n掉對方不愛的蔬菜，好像這樣就可以互相照顧，無堅不摧。\n\
  \n\n\n　　第一天，她們之間的友誼便毫無隔閡，卻也像是預示未來必須這樣間接\n\n的、才能傾訴，或者是因為回顧，讓每一句話、每一行動，都像賦予了意義\n\n\
  與預言：微笑對媽媽有恨，必須借貓才能傳達愛；對媽媽有愛，只能逃，才\n\n能逃離恨。這是她對愛最初的學習，對夏誾亦然，只是她們之間恨的間隔不\n\n是貓，而是死後重生、自我束縛的項鍊；愛的媒介則是畫，夏誾告訴微笑，\n\
  \n畫出來的都是畫；微笑告訴夏誾，心意是可以畫出來的。只是微笑畫的是抽\n\n象，心意無人欣賞；夏誾的畫則逼真寫實，才華也無人理解。\n\n\n\n　　除了彼此。\n\
  \n\n\n　　還有家境隔著彼此，女孩的原生家庭總是主宰著她們的命運。夏誾１７\n\n歲生日的前一天被微笑拉去穿耳洞，只來得及穿一隻，老闆欺負將商品散落\n\n\
  一地的微笑，要她全部賠償，兩個女孩同心協力才能逃走。微笑告訴夏誾，\n\n她要像她最愛的珍妮絲．賈普林一樣，「瘋狂再活個１０年，然後在２７歲\n\n死去」。喝醉的夏誾認真地說，如果你死了，我就會殺了你。\n\
  \n\n\n　　總是這樣，先察覺的，都接著意識到該預設死期，彷彿這樣才有活下去\n\n的勇氣。在廢墟裡的冒險和生日蛋糕，是辛苦過活的微笑所能給的一切，夏\n\n\
  誾又何嘗不知？她們為彼此戴一只耳環，像接近了盟誓；於是微笑說要環遊\n\n世界，邀夏誾一起去，但夏誾不敢坐飛機，也不可能一起用畫畫生活，父親\n\n要她當老師，說她怕高，很可怕，微笑說：\n\
  \n\n\n　　「怕什麼，我會保護你啊，依靠我吧。」\n\n　　「你又不是我男友。」\n\n　　「你有可以依靠的男友嗎？」\n\n\n\n　　總是這樣，隱諱的告白，然後迴避（但迴避不就是拒絕嗎）。微笑沒有\n\
  \n錢，依靠一個沒有錢但願意努力的男人還可以一起奮鬥創造未來，別人會說\n\n你是成功男人背後的偉大女人，再不濟，也有一個「糟糠之妻」的名份；但\n\n依靠一個沒有錢的女人，等於兩個女人沒有未來。所以，咸振宇（邊佑錫飾）\n\
  \n出現了，只見了一次面，夏誾說他有漂亮的眼睛（但片頭出現的，不正是微\n\n笑的眼睛嗎），「如果能畫得一模一樣，就能看見自己的心意」，還需要用\n\n畫畫、需要拍照來確認「我可以喜歡你」，這樣就夠了，畢竟是個男人，而\n\
  \n在那個２００４年，可以交配、繁衍後代的男和女，才是正常戀愛的配對，\n\n只要「鼓起勇氣」就可以說。\n\n\n\n　　心意是可以畫的。畫不出來的、不能畫的，無以言宣。\n\
  \n\n\n　　微笑當然懂得，迴避一次就夠了，在臨界時可以後退，可以跟夏誾繼續\n\n在一起，對她來說就是無比的幸福，可以捕捉夏誾回頭看她的眼睛、打哈欠\n\n\
  的眼淚、右臉頰的痣……這樣的細部觀察，戀物似的拆解所愛之人的每一部\n\n分，是振宇混沌的「全部」遠遠不及──更或者是，面對兩個迥異的女孩，\n\n男人總是分心，總覺得兩個都可愛，一個溫柔嫻靜剛毅適合在身邊當賢妻，\n\
  \n一個自由奔放脆弱適合瘋狂熱戀──隔著這個人，夏誾和微笑可以持續陪伴\n\n彼此，那是微笑最幸福的頂點，以及終點──男人終究忍不住，面對界線的\n\n試探和破壞，她只能咬他的舌頭，用他的愧疚要來那個可能靈驗的霹棗木項\n\
  \n鍊，要死過一次才能護佑生，她想要活過２７歲，忍過２７歲後死寂未來的\n\n恐懼，才能履行對夏誾的承諾，畢竟振宇如此，她再也不能陪在夏誾身邊。\n\n「你的背影突然讓我覺得陌生，因為你總是在我身邊。」那個超車、獨自離\n\
  \n開的微笑與背影，是離開她們生命的訣別。\n\n\n\n　　只是愛著一個人如何能輕易離開。原本微笑是可能留下的，她和原本無\n\n意的主唱交往，有男友為由，女人離開總是正當，「你喜歡那個男生喜歡到\n\
  \n要離開？」不，是我喜歡你喜歡到必須離開，「他需要我」而且會介紹她畫\n\n畫的老師，「那你需要他嗎？」微笑沒有回答，她不能說我需要你，但你最\n\n需要的不再是我，不會是我。彼時的夏誾還不想懂，寧可相信彷彿如常就不\n\
  \n會改變，直到看見項鍊，終於確知微笑要逃走的原因，所以明明來得及挽留，\n\n卻放了手──畢竟是她需要振宇。\n\n\n\n　　「太陽之所以能安心的發光，是因為影子的存在。雖然身處不同的地方，\n\
  \n但太陽知道影子就在不遠處，它知道自己不孤單。」這是只能愛靈魂的傾訴，\n\n儘管微笑作為夏誾嚮往自由的太陽，卻必須用謊言來掩飾自己的經濟困窘、\n\n關係背叛、前途茫茫；夏誾作為微笑嚮往安定的太陽，卻必須微微笑著，掩\n\
  \n飾自己的迷惘，用畫畫換得平靜。但微笑的畫始終不被認同，接著母親去世，\n\n讓微笑自問「每次的離別都讓我難受，長大後，這種感受會變得比較遲鈍嗎？」\n\n\
  預告了接下來的別離。振宇離開，微笑回來，送從首爾買來、「西伯利亞的」\n\n旅遊明信片；在浴室，微笑問要不要一起洗，說要看夏誾的胸部被拋毛巾笑\n\n鬧著拒絕；到處遊玩確認幼時情誼如昔之後，夏誾堅持要住高級飯店，為她\n\
  \n拿衛生棉時看見咸振宇的項鍊，微笑的護身符，同時也在此刻提醒夏誾的符\n\n咒：她們都是女人。夏誾付了住宿，微笑堅持請吃飯，付不起牛排的錢，就\n\n用為飯店客人調酒換來一瓶酒，夏誾問她我們來玩，為什麼要做這種事──\n\
  \n彼此的太陽在此刻都化為影子，藏在心底的刺鑽孔出血，迴避的終須面對：\n\n夏誾有父親，有男友，還有微笑的隱瞞，她清楚知道女人要靠自己過生活的\n\n艱難，過去隱約得知，如今再難無視；微笑則是想表現獨立，實際是，她的\n\
  \n「討生活」不免要用到實則剝削的「父權紅利」，在界線間徘徊，男人卻有\n\n權越線，問你怎麼這麼兇，剛剛不是還在撒嬌嗎？面對非得用砸瓶子威脅才\n\n聽得懂人話的男人，女人連不都要反覆強調──「怕什麼，我會保護你啊，\n\
  \n依靠我吧。」「你又不是我男友。」真相揭開的是，我不能保護你，和我知\n\n道你不能依靠。\n\n\n\n　　「你到死都不知道，我是怎麼活下來的。」\n\n\n\
  \n　　女人總是要計算清楚，尤其在可能付不出來之前。所以微笑走了，夏誾\n\n隔著門看見，依然不能挽留，因為她也一樣付不出來。\n\n\n\n　　這是她們第二次分別。\n\
  \n\n\n\n\n　　感情是會遲鈍的，離別亦然。微笑知道「獨立的女人」她還做不到，所\n\n以找了個可以一起投資的男友，卻在振宇以到首爾唸書為由，找到她的那一\n\
  \n天上吊自殺，遺留的債務帶走了微笑的錢、同居的房子，還有未來。瞬間落\n\n得一無所有的微笑，只能暫時依靠振宇的收留；而夏誾藉ＦＢ找到微笑的下\n\n落，想到振宇的疏於聯絡，從濟州島來到首爾，就這樣在振宇租屋處的門外\n\
  \n撞見他們。\n\n\n\n　　喝醉的微笑看見夏誾，失去防備與理性先去抱她，說「我好想你」；夏\n\n誾盯著振宇宛若敵人──若是戀人，會質問他要誰；所以她把振宇關在門外，\n\
  \n屋主不能進來，她要問的，是那個喝酒的，背叛她的微笑。\n\n\n\n　　那場浴室戲，跟《#刻在你心底的名字》的出櫃衝突一樣，表面上情敵\n\n對峙，實則是戀人吵架。夏誾用蓮蓬頭向微笑澆水，讓微笑清醒，\n\
  \n\n\n　　「你從以前就想這麼做了吧，現在振宇沒在看了。」\n\n　　「想說什麼就直接說出來啊，不要只是耿耿於懷……不然就讓我一個人，\n\n我因為你快難受死了。」\n\
  \n\n\n　　「你總是以為只有自己難受，只有你有苦衷。」\n\n\n\n　　夏誾回想當初遠遠看著振宇親吻微笑，卻不知道她要項鍊是為了活下去；\n\n看見掛在浴室的大紅胸罩，質問微笑是否曾與振宇上床，微笑慌急搖頭，夏\n\
  \n誾卻爆怒問她以前不是說不穿的嗎，然後脫自己的衣服宣示振宇愛的是這種\n\n款式，接著哭著說：「除了我以外，沒有人真心愛過你！沒有我你什麼都不\n\n是！」振宇是她的安定，微笑是她的真心，他們怎能聯手背叛？你怎麼可以\n\
  \n成為女人，還是搶我男友的女人？這同樣是對戀人的質問，但微笑百口莫辯：\n\n承認振宇愛的是我，還是我愛的始終是你？最終她只能哭說：「沒有你，就\n\n沒有我，可是我們怎麼會變成這樣？」\n\
  \n\n\n　　沒有共識，沒有解決任何事。夏誾出來一語不發，微笑則歸還項鍊，拖\n\n著行李遠走。振宇誰也沒留，前者他沒臉，後者他沒膽，那也就沒有機會明\n\n\
  白，那兩個女人都不要他，真正要的相伴卻不得不斷絕。\n\n\n\n　　但夏誾還是需要安定，她接受了他的懺悔、承諾與求婚，女人總歸要結\n\n婚的，她不想跟別人不一樣，或許以為只要安定，就能壓制對自由的想望，\n\
  \n卻發現振宇從未發現她不想當老師，對她想作畫的心意還批評為「畫得一樣\n\n是才藝，不是才華」──他始終要的，是像相片一樣乖順的、裝飾的妻子，\n\n這使她將會忘了自己是怎樣的人──所以她留下了相片逃婚。\n\
  \n\n\n　　「為什麼大家的臉都不一樣？因為每個人注定要過上不同的人生。」人\n\n生已經走過一遭的母親，這樣告訴夏誾，和微笑一樣，要她自由自在、依心\n\n\
  之所向而活。「當大浪席捲過後，思緒才變得清晰」的夏誾離開濟州島，住\n\n進微笑曾住的地方，開始畫畫思念對方──過去從未畫過的微笑，此刻獨自\n\n一人，才能藉由畫筆呈顯對她真正的感情──「現在，我想畫你的臉，是沒\n\
  \n有愛絕對無法下筆的畫。」然而意外懷孕，她只能投靠微笑，以及微笑所住\n\n房東與房客，「一對女性伴侶」的照顧。至此，夏誾才終於能向微笑坦承：\n\n\n\n\
  　　「我一直都知道你的心意，但我討厭、害怕你要離開我這件事，沒來由\n\n就討厭你。」\n\n　　「你討厭過我嗎？」\n\n　　「我討厭過你。」\n\n　　「我也是……但你還是來找我了呢。」\n\
  \n\n\n　　她們終於承認討厭過對方──然後夏誾告訴微笑，肚子裡孩子的胎名，\n\n正是「微笑」，「我討厭你」是我愛你，討厭是曾經，愛是始終。\n\n\n\n\
  　　但生下了微笑，帶走了夏誾的生命。當振宇經由畫展找到微笑，逼問她\n\n夏誾的下落，卻從手機來電顯示裡找到了「夏誾」──安夏誾，血緣上他與\n\n夏誾的女兒，實際上是微笑時跟微笑相似的母女。夏誾的死，也帶走了見證\n\
  \n她們相識相愛相別的貓「媽媽」，藉由夏誾的母親，微笑看到夏誾的畫，逼\n\n真的，畫著她愛過的人，而最大的那一幅未完成的，是應聲回首、「最幸福」\n\n時的微笑──當微笑提筆作畫為夏誾完成時，對著窗看著夏誾昔日畫畫的身\n\
  \n影，那是夏誾曾經放棄，後來拾起，與微笑曾經懷抱，後來放棄的繪畫──\n\n\n\n　　「旅行中的我突然明白，你就像昔日的我，我就像昔日的你。」\n\n\n\n\
  　　藉由藝術，她們合而為一：夏誾的身體死去，靈魂終得自由，帶著微笑\n\n的思念去旅行；微笑帶著夏誾和安定活下去，用藝術完成彼此的心意。她們\n\n不再需要形式上的陪伴：不能說愛，不能碰觸，不能擁有，僅能藉由繪畫，\n\
  \n將感受到的靈魂與牽掛帶到這個世界上，如此，即使作品與創作者不免各自\n\n獨立，但各自曾存留的形貌，將足以終生相繫。\n\n\n\n　　她們是靈魂伴侶。\n\
  \n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n                \
  \                  陳斐雯  貓蚤札（其三）\n\n--"
