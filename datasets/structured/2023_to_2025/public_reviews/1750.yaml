url: https://www.ptt.cc/bbs/movie/M.1698851763.A.02F.html
title: '[新聞] 梁朝偉受侯導啟蒙 稱王家衛像靈魂伴侶'
content: "梁朝偉受侯導啟蒙 稱王家衛像靈魂伴侶\n\n04:10 2023/11/01 中國時報 王思穎\n\n\n梁朝偉在威尼斯領金獅獎終身成就獎後，經過近2個月，首次分享對獎項的看法。\n\
  （VOGUE雜誌提供）\n\n國際巨星梁朝偉前陣子拿下第80屆威尼斯影展金獅獎終身成就獎，再創事業高峰，經過近\n2個月的時間，他接受雜誌訪問時首次透露，其實不喜歡看到獎盃，因為這樣就不會再進\n\
  步，認為好的東西不用提醒，要提醒的是需要改進的地方，「我從來不覺得拿完獎、人生\n就會改變，我大概放1個月就會把獎盃收起來，不讓自己看到。」\n\n他表示，自己不是為了追求高峰而演戲，只是單純喜歡這份工作、樂在其中，「演員這份\n\
  工作是為了熱情才做，其它東西該來的就會來，不來就不來，沒什麼好追求的。」他第一\n次在國際影壇受矚目，是主演侯孝賢導演的《悲情城市》，侯孝賢對他而言是啟蒙老師般\n\
  存在。\n\n另一位他人生中的重要導演王家衛，則像靈魂伴侶般的存在，梁朝偉回顧過去41年的演藝\n生涯，他說，最低潮的時候就是認識王家衛之前，「那時候我覺得在表演上沒辦法再突破\n\
  ，因為單憑我的知識跟天賦不夠，結果王家衛就出現了。」\n\n當他看完2人合作的《阿飛正傳》最後一個鏡頭，覺得這個導演很會拍他，就此2人展開長\n達20年的合作，梁朝偉感激地說：「我一直覺得自己非常幸運。」\n\
  \n#工作 #王家衛 #梁朝偉 #靈魂伴侶 #時候\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是\
  \ 菩薩\n\n\n\n--"
