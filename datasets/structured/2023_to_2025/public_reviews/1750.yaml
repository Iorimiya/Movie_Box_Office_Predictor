url: https://www.ptt.cc/bbs/movie/M.1680277104.A.664.html
title: '[好雷] 《靈魂伴侶》，喜歡她們本來就是一個人'
content: '部落格版：


  其實一直到了很中間，我才後知後覺的發現，原來《靈魂伴侶》就是香港的《七月與安生

  》，熟悉的人物關係配置、熟悉的劇情、熟悉的發展，還有熟悉的那些飄散在空中的情感

  ，以及熟悉的、兩個女孩的悸動與躁動。七年前的《七月與安生》，每個走進戲院觀賞的

  觀眾，都陪著七月與安生走過那段青蔥歲月，在她們相識十多年的日子裡，與她們快樂並

  痛著的歷經成長，友情與愛情相互折磨然後撕扯著她們，她們曾經討厭甚至恨過對方，但

  她們最後還是回到了彼此身邊，在哭著哭著就笑了的眼神裡，七月與安生不僅找到了對方

  ，也找到了自己的心之所向。《七月與安生》跳脫了青春電影的框架，電影用了不同方式

  來描寫成長，更在男性角色缺席多數時間的過程中談論女性意識覺醒，《七月與安生》無

  疑超越了青春電影的厚度。


  基本上《靈魂伴侶》與《七月與安生》兩個版本的劇情幾乎一模一樣，連原版後來結局的

  三次反轉，導演閔永根都保留了下來，僅有某些小地方有著不同，例如原版裡七月與安生

  的故事被寫成了小說，在韓版中則在網上部落格裡記載；而本來安生在家鄉是名銀行職員

  ，在這裡夏誾則當起了老師...等的小地方，整體上的差別並不大，因此可以說《靈魂伴

  侶》其實就像是套上韓國電影濾鏡的《七月與安生》，不過這並不表示韓版就是一昧的照

  本宣科。導演閔永根在電影裡頭放入了原版所沒有的繪畫元素來當作觸發情感的按鈕，微

  笑與夏誾從小開始的繪畫興趣，是兩人「兩個身體，一個靈魂」的證明，長大後她們各自

  擅長寫實畫風與抽象畫風，則是反映著兩人的性格與個性是如此的截然不同，而最後兩人

  共同攜手完成了一幅畫作，成了兩人靈魂終於合二為一的象徵。在導演閔永根的編排下，

  繪畫不僅是劇中角色情感的媒介，同時也是煽動觀眾情緒的關鍵，這個多出來的差異或許

  能讓《靈魂伴侶》有可能比原版來得有更多的情感渲染力。


  「當我畫得一模一樣，就能看見自己的心意。」


  我很喜歡導演閔永根賦予繪畫的意義。讓傳達者以直白的方式傳達，然後讓接收者很能清

  楚的接收，來自於對方想要讓自己知道的心意，那些本來看不見的真實想法與感受，都藉

  著一幅又一幅的畫變得肉眼可見，不隱諱也不害臊的，直直的傳達出去。夏誾就像她所擅

  長的寫實畫風，總是觀察入微、心思細膩，雖然她看似不像微笑那樣活潑外放、敢於表達

  自己，但事實上她卻能將心意傾注於畫作裡，「聽說喜歡一個人是要鼓起勇氣的，所以我

  現在就是鼓起勇氣告白的。」，當她在聯誼上對著振宇這樣說時，其實觀眾就能夠隱約察

  覺，夏誾原來並沒有外表看起來那樣的不敢，只是和什麼都沒有的微笑相比，什麼都有的

  她反而更多了不少顧慮，不敢搭飛機恰好成了藉口，讓她能為自己選擇留在濟州島、選擇

  做個滿足父母或者說世俗對於好女孩該有的期待的女兒的這件事找個自圓其說的理由。



  「我第一次知道，心意也能被描繪出來。」


  無拘無束的微笑就像她的抽象畫，隨心所欲的超出任何課堂上的制式標準，就連制服都穿

  得隨性，想翹課就翹課、想幹嘛就幹嘛，看上去她是如此的自在灑脫，但其實她的內心卻

  是意外的纖細而又柔軟，只是她的表達方式總是笨拙。早已什麼都沒有的她，也就早習慣

  什麼都沒有的自己，即便在洞窟裡她拒絕了振宇的吻，但微笑依然害怕繼續相處會愛上對

  方然後傷害了夏誾，於是正好的她那貌似想要追逐自由、到外闖蕩的嚮往成了她離開家鄉

  、離開夏誾，一個剛剛好的逃避的理由。隨著劇情，會想是否微笑就像她擅長的抽象畫，

  那種恣意揮灑生命的豁達，不過就是她不願被人看穿脆弱與不安的偽裝，那些畫布上的鮮

  豔色彩是她的保護色，然而她其實比誰都還渴望安定與安穩。


  「仔細想想，我幾乎沒看過你的背影，因為從以前到現在，妳從來都在我的身旁。」


  在振宇的出現之後，微笑與夏誾對於對方開始有了矛盾的感覺，她們很想要留在彼此身邊

  ，但當對方選擇要離開自己的時候，微笑沒有開口要夏誾留下自己，夏誾也沒有開口留住

  微笑。因為她們知道，如果繼續待在彼此身邊，她們對彼此的喜歡最後反而會成為對彼此

  的傷害，也許用書信縮短首爾與濟州島的距離，用書信聯繫彼此、假裝對方還在自己身邊

  ，是她們所能想到最好的辦法。只是後來她們還是發現，她們的問題也許從來不在於振宇

  的介入，振宇不過是剛好的點燃並在後來助燃了她們對對方的妒火而已，渴望著對方所擁

  有著的自己所沒有的一切，才是她們真正的矛盾所在。


  「妳就像昔日的我，我就像昔日的妳。」


  然而就像前面提到的，隨著劇情行進觀眾會慢慢發現，不論是真的付諸行動還是心裡只是

  動過念，微笑與夏誾總想著要成為對方、想要擁有對方的生活，但原來到頭來她們早就已

  經是對方了，在歷經了許多經歷之後。振宇的出現是兩人自我意識覺醒的啟發，那場多年

  後兩人在餐廳的爭吵，則是兩人逐漸成為對方、也就是找到本來的自己的轉捩點，而最後

  兩人和解後的道別，是她們終於找到自己、找到了心之所向的證明。若說十年前的不挽留

  是因為嫉妒，於是自私的放任對方離開，那麼十年後的不挽留是因為成全，所以無法自私

  的要對方留下來，十年前、十年後，都是因為愛而讓她們分開，只是十年後的這一次，微

  笑與夏誾既是代替亦是接續，更像是本來就該如此的，成為了對方過著屬於自己的人生。



  「我要瘋狂的活十年，然後在二十七歲時死掉。」


  「妳不准比我先死，妳敢比我先死，妳就死定了。」


  不光是繪畫貫穿了整部電影，在《靈魂伴侶》中更有許多隨著劇情發展才逐漸揭曉的鋪陳

  ，而跟著這些鋪陳堆疊起來等待爆發的，是微笑與夏誾對彼此的情感，也是觀眾對她們的

  感情。儘管印象中《七月與安生》也有過相似的對話與橋段，不過畢竟已時隔多年記憶早

  就模糊，所以當後來揭曉，當年在洞窟裡振宇根本沒有親到微笑，而之所以那條項鍊會在

  微笑的身上，是因為微笑想要遵守對夏誾活過二十七歲、活得比她久的承諾時，心裡頭的

  感動實在難以言喻。當然你說項鍊的轉移難道不是出於喜歡嗎？我想，喜歡肯定是有的，

  只是如果是單純的喜歡，微笑是不會要振宇送她的，同樣的，她也不會因為振宇喜歡她就

  收下這份禮物，畢竟在她和夏誾的心裡，無論如何最在乎的永遠都是對方。


  「但現在妳來找我了呢。」


  「因為我很想妳。」


  那份在乎讓微笑與夏誾即使繞了好幾個彎，最終還是會回到彼此身邊，她們就像微笑告訴

  夏誾的，她們是彼此的太陽、彼此的影子，怎麼樣也分不開。《靈魂伴侶》在同樣的故事

  基底之上，額外放入電影裡的繪畫元素，將心意的意義賦予在上頭，電影從一幅畫開始也

  從一幅畫結束，導演閔永根讓《靈魂伴侶》有著不輸給《七月與安生》的感動，不論是那

  間兩人先後來到的套房牆上那被保留下來的笑臉塗鴉，或者是夏誾那未完成而微笑接手完

  成的超寫實素描，一筆一畫的線條清楚勾勒出了微笑與夏誾對彼此的情感，那是沒有愛就

  無法畫出來的畫。就我自己而言，從《七月與安生》到《靈魂伴侶》都很喜歡，先是喜歡

  導演曾國祥拍出了這個故事，後來喜歡導演閔永根圓滿了這個故事，喜歡周冬雨和馬思純

  ，喜歡金多美和全昭霓，喜歡她們本來就是一個人的樣子。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
