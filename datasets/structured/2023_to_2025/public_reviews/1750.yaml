title: '[討論] 花樣年華 4K修復版 被時代耽誤的靈魂伴侶'
content: '---------------------放雷------------------------------



  那天提早下班想來個久違的電影時間好好放鬆一下

  結果竟然讓我找到花樣年華的4K修復版

  超級喜歡王家衛導演拍的片

  節奏雖然緩慢

  但他的獨特運鏡跟適時的留白

  可以讓觀眾很自然的融入角色跟劇本


  尤其是花樣年華這部

  題材走的超前面

  真的是80年代的經典

  電影主要是探討1960年代保守的社會風氣下

  面對外遇的議題

  角色心境的轉變與掙扎

  看到戲中梁朝偉跟張曼玉的互動

  都覺得他們才真的是一對阿

  真正的靈魂伴侶

  只是相見恨晚而已

  面對保守時代的框架還有世人的指指點點

  就算再愛還是不能說出口

  最終還是只能繼續扮演好自己原先的角色

  看完真的是滿滿的惆悵

  但下次轉到又會乖乖把他看完

  只能說經典就是有一種讓人一看再看的魔力


  近半年很多修復片 再看一次都有不同韻味

  大家還看過那些4K修復的經典電影，歡迎一起討論~



  --'
