url: https://www.ptt.cc/bbs/movie/M.1755404276.A.9FC.html
title: '[靈魂雷] 靈魂伴侶（2023年，韓國電影）'
content: '靈魂伴侶（2023年，韓國電影）


  由閩龍根導演執導；改編自中國大陸網路小說作家安妮寶貝的《七月與安生》；兩位女主

  角由金多美飾演安微笑、全少妮飾演高夏誾（ㄧㄣˊ）；男

  配角由邊佑錫飾演咸鎮佑。


  因為有了曾國祥導演的電影作品《七月與安生》，外加當時第53屆金馬獎給了周冬雨和馬

  思純雙影后的肯定，自然地，對這部韓國買版權來翻拍的電影自然要求度會變高（個人想

  法）。


  故事同如《七月與安生》，微笑與夏誾在濟州島過著形影不離的生活，兩人一同養了一隻

  貓咪叫做「媽媽」，共同的興趣是畫畫，但是兩位女主畫風迥異，也對青春期穿內衣有了

  不同的看法。


  電影雖離不開《七月與安生》的影子，但也並非100%照抄，還是拍出了韓國電影獨有的浪

  漫與劇本改編再改編的功力，光是看著安微笑與高夏誾的女性友情大概可以哭10次！


  觀影心得是：

  1）電影第一幕與最後幾幕是安微笑的素描（金多美好漂漂！


  2）雙女主的信物很感人，這裡不暴雷了！

  3)韓國人都嚮往首爾，男配角也不例外

  4）相較於曾國祥導演在《七月與安生》片尾3度反轉聞名，《靈魂伴侶》更著重於安微笑

  與高夏誾的友誼，深刻刻劃了兩位女性朋友之間的心理活動。


  2024年9月看的，以上全部是零碎的回憶心得，謝謝大家～



  --'
