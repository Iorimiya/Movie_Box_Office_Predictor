url: https://www.ptt.cc/bbs/movie/M.1748771117.A.71F.html
title: '[好雷] 關於愛的練習'
content: '這部是由《世界上最爛的人》

  製片湯瑪斯·羅布薩姆（Thomas Robsahm）製作

  我看到這個資訊，就迫不及待的想看

  看完心得，沒讓我失望，很好看


























  以下防雷

  片頭一開始介紹她前段的婚姻狀況

  下個場景，呈現她遇到覺得一定要擁有的男人

  並做出行動


  老實說，這個時候我超級討厭女主角

  女主角明明還沒做什麼，但就是很莫名的討厭她

  不知道是色彩光線效果？還是導演的呈現？

  或者是女主角的氣場？


  結婚後，他們遇到的問題

  就跟一般的婚姻生活一樣


  會有一方不滿，而另一方原本不知道狀況

  但沒溝通好，導致雙方都會不滿

  甚至走向離婚


  女方很不解，為什麼前面婚姻也這樣

  這段婚姻也這樣

  回到娘家，媽媽也是被氣到走出家裡冷靜


  後來婚姻諮商老公沒來

  諮商師問她要不要繼續進行

  開啟了她自我修復之旅


  貫穿這部電影的兩個字“羞愧”


  諮商師聽了她的敘述，覺得她“溝通”或交流下

  會無意識的想讓對方“羞愧”


  這種想法下溝通，只會吵對或錯

  最終會吵的沒完沒了


  她後來才慢慢的了解到，屬於自己的問題在哪裡

  諮商了幾次之後，她回到住處，面對鏡子說了一些鼓勵自己的話

  隔天醒來，洗完澡的場景，呼應到最前面一開始的鏡頭


  改變心境下的相處下，整個生活起了變化

  不管是跟女兒，還是老公

  相處與溝通搭起了橋樑


  最後的場景很讓人感動


  結束後，我心很平靜的離開

  可能過去的感情經驗，讓我投射到電影內部而產生共鳴

  因為結局，讓我產生平靜的心情


  最後還是要呼籲

  喜歡“世界上最爛的人”的人，一定看這一部：）





  -----

  Sent from JPTT on my Sony XQ-DQ72.


  --

  我也想二刷了：）

  牽起手了，感覺應該是有機會了吧！？

  給觀眾一點希望與慰藉也不錯呀：）

  我覺得都好窒息，只能說演的很厲害'
